spring.application.name=admindashboard
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# =========================
# DATABASE (Render)
# =========================
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/admindashboard}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# =========================
# JPA Settings
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# MAIL Configuration
# =========================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.******
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# SERVER (Render uses PORT)
# =========================
server.port=${PORT:8080}

# =========================
# CHARACTER ENCODING
# =========================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# =========================
# FILE UPLOAD LIMITS
# =========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
