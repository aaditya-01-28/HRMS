<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Dependents | WhiteCircle Health</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    

    <style>
        :root {
            --med-primary: #1E88E5;
            --med-primary-dark: #1565C0;
            --med-green: #43A047;
            --bg-color: #f4f7fb;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

		*{
		    margin:0;
		    padding:0;
		    box-sizing:border-box;
		}


		body{
		    background:#F3F4F6;
		    font-size:14px;
		    color:#111827;
			font-family:Arial,sans-serif;
		}

		.dashboard-wrapper{
		    display:flex;
		    min-height:100vh;
		}

		/* SIDEBAR */

		.sidebar{
		    width:250px;
		    background:#001A57;
		    padding:24px 10px;
		    flex-shrink:0;
		}

		.sidebar-logo{
		    text-align:center;
		    margin-bottom:40px;
		}

		.sidebar-logo img{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.sidebar-menu{
		    display:flex;
		    flex-direction:column;
		    gap:12px;
		}

		.menu-item{
		    display:flex;
		    align-items:center;
		    gap:8px;
		    color:white;
		    text-decoration:none;
		    padding:10px 12px;
		    border-radius:10px;
		    font-size:14px;
		}

		.menu-item:hover,
		.menu-item.active{
		    background:#2E63FF;
		}

		/* MAIN */

		.main-section{
		    flex:1;
		    display:flex;
		    flex-direction:column;
		}

		.top-header{
		    height:90px;
		    background:#F0F2F5;

		    border-bottom:2px solid #CBD5E1;

		    display:flex;
		    align-items:center;
		    justify-content:space-between;

		    padding:0 30px;
		}

		.header-left{
		    display:flex;
		    align-items:center;
		    gap:12px;
		}

		.header-icon{
		    width:42px;
		    height:42px;
		    object-fit:contain;
		}

		.header-left h1{
		    font-size:20px;
		    font-weight:700;
		    color:#0B2E7A;
		    margin:0;
		}

		.back-home-btn{
		    background:#2E63FF;
		    color:white;

		    text-decoration:none;

		    padding:12px 35px;

		    border-radius:8px;

		    font-size:14px;
		    font-weight:700;
		}

		.back-home-btn:hover{
		    color:white;
		}

		/* CONTENT */

		.dashboard-content{
		    padding:35px 40px;
		}

		/* PAGE TITLE */

		.page-title{
		    font-size:20px;
		    font-weight:700;
		    margin-bottom:25px;
		}

		/* FORM */

		.form-group{
		    margin-bottom:30px;
		    width:350px;
		}

		.form-group label{
		    display:block;
		    margin-bottom:10px;
		    font-size:14px;
		    font-weight:700;
		    color:#111827;
		}

		.custom-input{
		    width:100%;
		    height:44px;

		    border:1px solid #333;
		    border-radius:6px;

		    background:white;

		    padding:0 12px;

		    font-size:14px;
		}

		.custom-input:focus{
		    outline:none;
		}

		/* UPLOAD BOX */

		.upload-box{
		    width:350px;
		    height:150px;

		    border:1px dashed #444;

		    background:white;

		    display:flex;
		    flex-direction:column;
		    justify-content:center;
		    align-items:center;

		    position:relative;
		}

		.upload-box i{
		    font-size:42px;
		    color:#777;
		    margin-bottom:10px;
		}

		.upload-box p{
		    margin:0;
		    font-size:14px;
		    font-weight:700;
		}

		.upload-box span{
		    color:#2E63FF;
		    font-weight:700;
		}

		.upload-box input{
		    position:absolute;
		    inset:0;
		    opacity:0;
		    cursor:pointer;
		}

		/* BUTTON */

		.submit-btn{
		    width:150px;
		    height:42px;

		    border:none;
		    border-radius:8px;

		    background:#2E63FF;
		    color:white;

		    font-size:18px;
		    font-weight:700;

		    cursor:pointer;
		}

		.submit-btn:hover{
		    opacity:.95;
		}

		/* RESPONSIVE */

		@media(max-width:992px){

		    .dashboard-content{
		        padding:25px;
		    }

		    .form-group,
		    .upload-box{
		        width:100%;
		        max-width:450px;
		    }
		}

		@media(max-width:768px){

		    .dashboard-wrapper{
		        flex-direction:column;
		    }

		    .sidebar{
		        width:100%;
		    }

		    .top-header{
		        height:auto;
		        flex-direction:column;
		        gap:15px;
		        padding:20px;
		    }

		    .back-home-btn{
		        width:100%;
		        text-align:center;
		    }

		    .dashboard-content{
		        padding:20px;
		    }

		    .form-group{
		        width:100%;
		    }

		    .upload-box{
		        width:100%;
		    }
		}
    </style>
</head>
<body>

<div class="dashboard-wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-logo">
            <img th:src="@{/images/wcg-logo.jpg}" alt="WhiteCircle">
        </div>

        <div class="sidebar-menu">

            <a href="/employee/mediclaim/portal"
               class="menu-item">
                <i class="fa-solid fa-table-columns"></i>
                Dashboard
            </a>

            <a href="/employee/mediclaim/policy"
               class="menu-item active">
                <i class="fa-solid fa-file-shield"></i>
                Coverage
            </a>

            <a href="/employee/mediclaim/track/list"
               class="menu-item">
                <i class="fa-solid fa-file-medical"></i>
                Claims
            </a>

            <a href="/employee/mediclaim/helpdesk"
               class="menu-item">
                <i class="fa-solid fa-circle-question"></i>
                Help Center
            </a>

        </div>

    </div>

    <!-- MAIN -->
    <div class="main-section">

        <div class="top-header">

            <div class="header-left">

                <img th:src="@{/images/wcg-logo.jpg}"
                     class="header-icon">

                <h1>My Mediclaims</h1>

            </div>

            <a href="/employee/mediclaim/policy"
               class="back-home-btn">
                Back
            </a>

        </div>

        <div class="dashboard-content">
			<h2 class="page-title">
			    Add Dependents
			</h2>

			<form id="dependentForm"
			      th:action="@{/employee/mediclaim/dependents/add}"
			      method="post"
			      enctype="multipart/form-data">

			    <div class="form-group">

			        <label>Full Name</label>

			        <input type="text"
			               name="fullName"
			               class="custom-input"
			               required>

			    </div>

			    <div class="form-group">

			        <label>Relationship</label>

			        <select name="relationship"
			                class="custom-input"
			                required>

			            <option value="">Select</option>
			            <option value="Spouse">Spouse</option>
			            <option value="Child">Child</option>
			            <option value="Parent">Parent</option>

			        </select>

			    </div>

			    <div class="form-group">

			        <label>Date Of Birth</label>

			        <input type="date"
			               name="dob"
			               id="dobInput"
			               class="custom-input"
			               required>

			    </div>

			    <div class="form-group">

			        <label>Gender</label>

			        <select name="gender"
			                class="custom-input">

			            <option value="">Select Gender</option>
			            <option value="Male">Male</option>
			            <option value="Female">Female</option>
			            <option value="Other">Other</option>

			        </select>

			    </div>

			    <div class="form-group">

			        <label>Coverage Percentage</label>

			        <input type="number"
			               name="coveragePercentage"
			               min="0"
			               max="100"
			               class="custom-input"
			               required>

			    </div>

			    <div class="form-group">

			        <label>Upload Documents</label>

			        <div class="upload-box">

			            <i class="fa-solid fa-cloud-arrow-up"></i>

			            <p>Upload files here</p>

			            <span>or Browse</span>

						<input type="file"
						       name="document"
						       id="document"
						       accept=".pdf,.jpg,.jpeg,.png">
					   <p id="selectedFileName"
					      style="margin-top:10px;font-size:13px;">
					       No file selected
					   </p>

			        </div>

			    </div>

			    <button type="submit"
			            class="submit-btn">
			        Add
			    </button>

			</form>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {

        // 1. DATE VALIDATION: Restrict future dates & cap the year limits
        const dobInput = document.getElementById('dobInput');
        if(dobInput) {
            // Get today's date in YYYY-MM-DD format
            const today = new Date().toISOString().split('T')[0];
            dobInput.setAttribute('max', today); // Automatically blocks future dates and years > 9999
        }

        // 2. AUTO-AVATAR GENERATOR
        const colors = ['#1E88E5', '#43A047', '#FB8C00', '#8E24AA', '#E53935', '#00ACC1'];
        document.querySelectorAll('.avatar-circle').forEach(avatar => {
            if(!avatar.innerHTML) {
                const name = avatar.getAttribute('data-name');
                if(name) {
                    const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    const colorIndex = name.length % colors.length;
                    avatar.innerHTML = initials;
                    avatar.style.background = `linear-gradient(135deg, ${colors[colorIndex]}, #111)`;
                }
            }
        });

        // 3. MODAL & FORM LOGIC
        const form = document.getElementById('dependentForm');
        const confirmationModal = new bootstrap.Modal(document.getElementById('confirmationModal'));
        const successModal = new bootstrap.Modal(document.getElementById('successModal'));

        // Intercept form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop normal redirect

            // Validate form natively before showing modal
            if(form.checkValidity()) {
                confirmationModal.show();
            } else {
                form.reportValidity();
            }
        });

        // Cancel Button Logic - Hides modal AND resets the form details
        document.getElementById('cancelConfirmBtn').addEventListener('click', function() {
            confirmationModal.hide();
            form.reset(); // Clears all form values as requested
        });

        // Proceed Button Logic - Send data via Fetch API
        document.getElementById('proceedRegisterBtn').addEventListener('click', function() {
            confirmationModal.hide();

            // Format form data for Spring Boot processing
            const formData = new URLSearchParams(new FormData(form));

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            }).then(response => {
                if (response.ok) {
                    successModal.show();
                } else {
                    alert("Error processing request. Please try again.");
                }
            }).catch(error => {
                console.error("Error:", error);
            });
        });

        // Close Success Modal & Refresh page to show new dynamic data
        document.getElementById('closeSuccessBtn').addEventListener('click', function() {
            successModal.hide();
            window.location.reload();
        });
    });
	
	document.getElementById("document")
	        .addEventListener("change", function () {

	    const fileName =
	        this.files.length > 0
	            ? this.files[0].name
	            : "No file selected";

	    document.getElementById("selectedFileName")
	            .textContent = fileName;
	});
</script>
</body>
</html>
