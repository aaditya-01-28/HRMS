<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Profile | WhiteCircle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    

    <style>
        :root {
            --primary-blue: #4f8bf9;
            --light-blue: #e8effe;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-page: #f8fafc;
            --border-color: #cbd5e1;
        }

		body {
		    font-family: Arial, sans-serif;
		    background: #efefef;
		    margin: 0;
		    padding: 0;
		}

		.profile-wrapper {
		    width: 100%;
		    min-height: 100vh;
		    background: #efefef;
		}

		.profile-header {
		    height: 56px;
		    background: #dfe3e8;
		    border-bottom: 2px solid #c7d5ef;
		    display: flex;
		    align-items: center;
		    padding: 0 18px;
		}

		.profile-title {
		    display: flex;
		    align-items: center;
		    gap: 10px;
		    color: #163d77;
		    font-size: 16px;
		    font-weight: 700;
		}

		.profile-title i {
		    color: #0b73d9;
		    font-size: 22px;
		}

		.profile-tabs {
		    display: flex;
		    align-items: center;
		    background: #d9e3ef;
		    border-top: 1px solid #d4d4d4;
		    padding: 0 12px;
		}

		.profile-tab {
		    border: none;
		    background: transparent;
		    padding: 14px 18px;
		    font-size: 15px;
		    font-weight: 700;
		    color: #233f67;
		    cursor: pointer;
		}

		.profile-tab.active {
		    color: #0066cc;
		    text-decoration: underline;
		}

		.tab-content {
		    display: none;
		    padding: 25px 35px;
		}

		.tab-content.active {
		    display: block;
		}

		.form-two-column {
		    max-width: 1100px;
		    margin: auto;
		    display: grid;
		    grid-template-columns: 1fr 1fr;
		    gap: 30px 60px;
		}

		.field-block {
		    display: flex;
		    flex-direction: column;
		}

		.field-block label {
		    font-size: 14px;
		    font-weight: 700;
		    color: #222;
		    margin-bottom: 8px;
		}

		.field-block input,
		.field-block select,
		.field-block textarea {
		    height: 38px;
		    border: 1px solid #666;
		    border-radius: 3px;
		    background: #fff;
		    padding: 6px 10px;
		}

		.field-block textarea {
		    height: 110px;
		    resize: none;
		}

		.section-heading {
		    font-size: 32px;
		    color: #0b55d4;
		    font-weight: 700;
		    margin-bottom: 25px;
		}

		@media(max-width:768px){

		    .profile-tabs{
		        overflow-x:auto;
		    }

		    .form-two-column{
		        grid-template-columns:1fr;
		        gap:20px;
		    }

		    .tab-content{
		        padding:20px;
		    }
		}
		.field-block textarea{
		    height:110px;
		}

		.field-block.full-height{
		    grid-row:span 2;
		}
		.field-block select{
		    height:38px;
		    border:1px solid #666;
		    border-radius:3px;
		    background:#fff;
		    padding:6px 10px;
		}
		
    </style>
</head>
<body>

<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show fw-bold shadow-sm" style="position: fixed; top: 90px; right: 20px; z-index: 1050;" role="alert">
    <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- TOP NAV -->
<div class="profile-wrapper">

    <div class="profile-header">
        <div class="profile-title">
            <i class="fas fa-user-circle"></i>
            <span>My Profile</span>
        </div>
    </div>

    <div class="profile-tabs">

        <button class="profile-tab active"
                onclick="showTab('general',this)">
            General
        </button>

        <button class="profile-tab"
                onclick="showTab('classification',this)">
            Classification
        </button>

        <button class="profile-tab"
                onclick="showTab('statutory',this)">
            Statutory
        </button>

        <button class="profile-tab"
                onclick="showTab('address',this)">
            Address
        </button>

        <button class="profile-tab"
                onclick="showTab('hrcategory',this)">
            HR Category
        </button>

        <button class="profile-tab"
                onclick="showTab('documents',this)">
            Documents
        </button>

    </div>
	
	<div id="general" class="tab-content active">

	    <div class="form-two-column">

	        <!-- Left Side -->

	        <div class="field-block">
	            <label>Employee ID *</label>
	            <input type="text"
	                   th:value="${user.username}"
	                   readonly>
	        </div>

	        <div class="field-block">
	            <label>Spouse Name</label>
	            <input type="text"
	                   placeholder="">
	        </div>

	        <div class="field-block">
	            <label>Full Name *</label>
	            <input type="text"
	                   th:value="${user.fullName}">
	        </div>

	        <div class="field-block">
	            <label>Date of Joining</label>
	            <input type="date"
	                   name="joiningDate"
	                   th:value="${user.employeeProfile?.joiningDate}">
	        </div>

	        <div class="field-block">
	            <label>Gender *</label>

	            <select name="gender">
	                <option value="">Select Gender</option>

	                <option value="Male"
	                        th:selected="${user.employeeProfile?.gender == 'Male'}">
	                    Male
	                </option>

	                <option value="Female"
	                        th:selected="${user.employeeProfile?.gender == 'Female'}">
	                    Female
	                </option>

	                <option value="Other"
	                        th:selected="${user.employeeProfile?.gender == 'Other'}">
	                    Other
	                </option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>Date of Salary</label>
	            <input type="date">
	        </div>

	        <div class="field-block">
	            <label>Father's Name</label>
	            <input type="text">
	        </div>

	        <div class="field-block">
	            <label>Probation Period (in days)</label>
	            <input type="number">
	        </div>

	        <div class="field-block">
	            <label>Mother's Name</label>
	            <input type="text">
	        </div>

			<div class="field-block full-height">
			    <label>Notes</label>
			    <textarea></textarea>
			</div>

	        <div class="field-block">
	            <label>Marital Status *</label>

	            <select>
	                <option>Select Marital Status</option>
	                <option>Single</option>
	                <option>Married</option>
	                <option>Divorced</option>
	                <option>Widowed</option>
	            </select>
	        </div>

	    </div>

	</div>

	<div id="classification" class="tab-content">

	    <div class="form-two-column">

	        <div class="field-block">
	            <label>Branch</label>
	            <input type="text">
	        </div>

	        <div class="field-block">
	            <label>Designation</label>
	            <input type="text"
	                   th:value="${user.designation}">
	        </div>

	        <div class="field-block">
	            <label>Salary Structure</label>
	            <select>
	                <option>Select Salary Structure</option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>Bank</label>
	            <input type="text"
	                   name="bankName"
	                   th:value="${user.employeeProfile?.bankName}">
	        </div>

	        <div class="field-block">
	            <label>Leave Policy</label>
	            <select>
	                <option>Select Leave Policy</option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>A/C No.</label>
	            <input type="text"
	                   name="bankAccountNumber"
	                   th:value="${user.employeeProfile?.bankAccountNumber}">
	        </div>

	        <div class="field-block">
	            <label>Attendance Structure</label>
	            <select>
	                <option>Select Attendance Structure</option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>IFSC Code</label>
	            <input type="text"
	                   name="bankIfscCode"
	                   th:value="${user.employeeProfile?.bankIfscCode}">
	        </div>

	        <div class="field-block">
	            <label>Timesheet Policy</label>
	            <select>
	                <option>Select Timesheet Policy</option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>Department</label>
	            <input type="text"
	                   th:value="${user.employeeProfile?.businessUnit}">
	        </div>

	        <div class="field-block">
	            <label>T & A Policy</label>
	            <select>
	                <option>Select T & A Policy</option>
	            </select>
	        </div>

	        <div class="field-block">
	            <label>Category</label>
	            <select>
	                <option>Select Category</option>
	            </select>
	        </div>

	    </div>

	</div>

	<div id="statutory" class="tab-content">

	    <div class="form-two-column">

	        <div class="field-block">
	            <label>Aadhar Card No.</label>
	            <input type="text"
	                   name="aadharNo"
	                   th:value="${user.employeeProfile?.aadharNo}">
	        </div>

	        <div class="field-block">
	            <label>PF No.</label>
	            <input type="text"
	                   placeholder="">
	        </div>

	        <div class="field-block">
	            <label>PAN Card No.</label>
	            <input type="text"
	                   name="panNo"
	                   th:value="${user.employeeProfile?.panNo}">
	        </div>

	        <div class="field-block">
	            <label>Passport No.</label>
	            <input type="text"
	                   placeholder="">
	        </div>

	        <div class="field-block">
	            <label>ESI No.</label>
	            <input type="text"
	                   placeholder="">
	        </div>

	        <div class="field-block">
	            <label>UAN</label>
	            <input type="text"
	                   placeholder="">
	        </div>

	    </div>

	</div>

	<div id="address" class="tab-content">

	</div>

	<div id="hrcategory" class="tab-content">

	</div>

	<div id="documents" class="tab-content">

	</div>

	</div>

    <!-- MAIN GRID -->
    <div class="content-container">
        
        <!-- ROW 1: Personal & Bank -->
        <div class="row g-5 mb-5">
            <div class="col-lg-6">
                <div class="section-block">
                    <div class="section-title"><i class="fas fa-user"></i> Personal Details</div>
                    <div class="form-grid">
                        <div class="field-group"><label class="field-label">Mobile No.</label><div class="field-value" th:text="${user.employeeProfile?.mobileNumber}"></div><input type="text" name="mobileNumber" class="editable-input tracked-field" th:value="${user.employeeProfile?.mobileNumber}" pattern="\d{10}"></div>
                        <div class="field-group"><label class="field-label">Personal Email</label><div class="field-value" th:text="${user.employeeProfile?.personalEmail}"></div><input type="email" name="personalEmail" class="editable-input tracked-field" th:value="${user.employeeProfile?.personalEmail}"></div>
                        <div class="field-group"><label class="field-label">Gender</label><div class="field-value" th:text="${user.employeeProfile?.gender}"></div><select name="gender" class="editable-input tracked-field"><option value="">Select</option><option value="Male" th:selected="${user.employeeProfile?.gender == 'Male'}">Male</option><option value="Female" th:selected="${user.employeeProfile?.gender == 'Female'}">Female</option></select></div>
                        <div class="field-group"><label class="field-label">Official Email</label><div class="field-value" th:text="${user.email}"></div><input type="email" class="editable-input" th:value="${user.email}" readonly></div>
                        <div class="field-group"><label class="field-label">Aadhaar Card No.</label><div class="field-value" th:text="${user.employeeProfile?.aadharNo}"></div><input type="text" name="aadharNo" class="editable-input tracked-field" th:value="${user.employeeProfile?.aadharNo}" pattern="\d{12}"></div>
                        <div class="field-group"><label class="field-label">Date of Birth</label><div class="field-value" th:text="${user.employeeProfile?.dob}"></div><input type="date" name="dob" class="editable-input tracked-field" th:value="${user.employeeProfile?.dob}"></div>
                        <div class="field-group" style="grid-row: span 2;"><label class="field-label">Permanent Address</label><div class="field-value" style="height: 100%; align-items: flex-start;" th:text="${user.employeeProfile?.permanentAddress}"></div><textarea name="permanentAddress" class="editable-input tracked-field" style="height: 100px; resize: none;" th:text="${user.employeeProfile?.permanentAddress}"></textarea></div>
                        <div class="field-group"><label class="field-label">PAN Card No.</label><div class="field-value text-uppercase" th:text="${user.employeeProfile?.panNo}"></div><input type="text" name="panNo" class="editable-input tracked-field text-uppercase" th:value="${user.employeeProfile?.panNo}" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <!-- ROW 2 right: Bank Details -->
                <div class="section-block mb-5">
                    <div class="section-title"><i class="fas fa-university"></i> Bank Details</div>
                    <div class="form-grid">
                        <div class="field-group"><label class="field-label">Account Number</label><div class="field-value" th:text="${user.employeeProfile?.bankAccountNumber}"></div><input type="text" name="bankAccountNumber" class="editable-input tracked-field" th:value="${user.employeeProfile?.bankAccountNumber}"></div>
                        <div class="field-group"><label class="field-label">IFSC Code</label><div class="field-value text-uppercase" th:text="${user.employeeProfile?.bankIfscCode}"></div><input type="text" name="bankIfscCode" class="editable-input tracked-field text-uppercase" th:value="${user.employeeProfile?.bankIfscCode}"></div>
                        <div class="field-group"><label class="field-label">Bank Name</label><div class="field-value" th:text="${user.employeeProfile?.bankName}"></div><input type="text" name="bankName" class="editable-input tracked-field" th:value="${user.employeeProfile?.bankName}"></div>
                        <div class="field-group"><label class="field-label">Branch Name</label><div class="field-value" th:text="${user.employeeProfile?.bankBranch}"></div><input type="text" name="bankBranch" class="editable-input tracked-field" th:value="${user.employeeProfile?.bankBranch}"></div>
                    </div>
                </div>

                <!-- ROW 2 left (moved to right column for balance): Work Details -->
                <div class="section-block">
                    <div class="section-title"><i class="fas fa-briefcase"></i> Work Details</div>
                    <div class="form-grid">
                        <div class="field-group"><label class="field-label">Date of Joining</label><div class="field-value" th:text="${user.employeeProfile?.joiningDate}"></div><input type="date" name="joiningDate" class="editable-input tracked-field" th:value="${user.employeeProfile?.joiningDate}"></div>
                        <div class="field-group"><label class="field-label">Experience</label><div class="field-value" th:text="${user.employeeProfile?.experience}"></div><input type="text" name="experience" class="editable-input tracked-field" th:value="${user.employeeProfile?.experience}"></div>
                        <div class="field-group"><label class="field-label">Work Location</label><div class="field-value" th:text="${user.employeeProfile?.workLocation}"></div><input type="text" name="workLocation" class="editable-input tracked-field" th:value="${user.employeeProfile?.workLocation}"></div>
                        <div class="field-group"><label class="field-label">City</label><div class="field-value" th:text="${user.employeeProfile?.city}"></div><input type="text" name="city" class="editable-input tracked-field" th:value="${user.employeeProfile?.city}"></div>
                        <div class="field-group"><label class="field-label">State/Country</label><div class="field-value" th:text="${user.employeeProfile?.country}"></div><input type="text" name="country" class="editable-input tracked-field" th:value="${user.employeeProfile?.country}"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FULL WIDTH ROW: Project & Allocation -->
        <div class="section-block full-width-section mb-5">
            <div class="section-title"><i class="fas fa-network-wired"></i> Project & Allocation</div>
            <div class="form-grid">
                <div class="field-group"><label class="field-label">Business Unit</label><div class="field-value" th:text="${user.employeeProfile?.businessUnit}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.businessUnit}" readonly></div>
                <div class="field-group"><label class="field-label">Account Name</label><div class="field-value" th:text="${user.employeeProfile?.accountName}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.accountName}" readonly></div>
                <div class="field-group"><label class="field-label">Project Name</label><div class="field-value" th:text="${user.employeeProfile?.projectName}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.projectName}" readonly></div>
                <div class="field-group"><label class="field-label">Project Code</label><div class="field-value" th:text="${user.employeeProfile?.projectCode}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.projectCode}" readonly></div>
                <div class="field-group"><label class="field-label">Team/Group</label><div class="field-value" th:text="${user.employeeProfile?.teamGroup}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.teamGroup}" readonly></div>
                <div class="field-group"><label class="field-label">Customer Name</label><div class="field-value" th:text="${user.employeeProfile?.customerName}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.customerName}" readonly></div>
                <div class="field-group"><label class="field-label">Vertical Name</label><div class="field-value" th:text="${user.employeeProfile?.verticalName}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.verticalName}" readonly></div>
                <div class="field-group"><label class="field-label">Domain/Industry</label><div class="field-value" th:text="${user.employeeProfile?.domainIndustry}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.domainIndustry}" readonly></div>
            </div>
        </div>

        <!-- FULL WIDTH ROW: Educational Details -->
        <div class="section-block full-width-section mb-5">
            <div class="section-title"><i class="fas fa-graduation-cap"></i> Educational Details</div>
            <div class="row g-4">
                <div class="col-md-6">
                    <h6 class="text-primary fw-bold mb-3">Highest Qualification</h6>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="field-group"><label class="field-label">Degree/Course</label><div class="field-value" th:text="${user.employeeProfile?.qual1Title}"></div><input type="text" name="qual1Title" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual1Title}"></div>
                        <div class="field-group"><label class="field-label">University/Board</label><div class="field-value" th:text="${user.employeeProfile?.qual1Inst}"></div><input type="text" name="qual1Inst" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual1Inst}"></div>
                        <div class="field-group"><label class="field-label">Passing Year</label><div class="field-value" th:text="${user.employeeProfile?.qual1Year}"></div><input type="text" name="qual1Year" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual1Year}" pattern="^(19|20)\d{2}$"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <h6 class="text-primary fw-bold mb-3">Secondary Qualification</h6>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="field-group"><label class="field-label">Degree/Course</label><div class="field-value" th:text="${user.employeeProfile?.qual2Title}"></div><input type="text" name="qual2Title" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual2Title}"></div>
                        <div class="field-group"><label class="field-label">University/Board</label><div class="field-value" th:text="${user.employeeProfile?.qual2Inst}"></div><input type="text" name="qual2Inst" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual2Inst}"></div>
                        <div class="field-group"><label class="field-label">Passing Year</label><div class="field-value" th:text="${user.employeeProfile?.qual2Year}"></div><input type="text" name="qual2Year" class="editable-input tracked-field" th:value="${user.employeeProfile?.qual2Year}" pattern="^(19|20)\d{2}$"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW LAST: Reporting & Emergency -->
        <div class="row g-5 mb-5">
            <div class="col-lg-6">
                <div class="section-block">
                    <div class="section-title"><i class="fas fa-sitemap"></i> Reporting Lines</div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="field-group"><label class="field-label">Reporting Manager</label><div class="field-value" th:text="${user.employeeProfile?.reportingManager}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.reportingManager}" readonly></div>
                        <div class="field-group"><label class="field-label">Project Manager</label><div class="field-value" th:text="${user.employeeProfile?.projectManager}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.projectManager}" readonly></div>
                        <div class="field-group"><label class="field-label">BU-HR Contact</label><div class="field-value" th:text="${user.employeeProfile?.buHrContact}"></div><input type="text" class="editable-input" th:value="${user.employeeProfile?.buHrContact}" readonly></div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6">
                <div class="section-block">
                    <div class="section-title danger"><i class="fas fa-plus-circle"></i> Emergency Contact Details</div>
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="field-group"><label class="field-label">Emergency Contact Person</label><div class="field-value" th:text="${user.employeeProfile?.emergencyContactName}"></div><input type="text" name="emergencyContactName" class="editable-input tracked-field" th:value="${user.employeeProfile?.emergencyContactName}"></div>
                        <div class="field-group"><label class="field-label">Relation with employee</label><div class="field-value" th:text="${user.employeeProfile?.relationWithEmployee}"></div><input type="text" name="relationWithEmployee" class="editable-input tracked-field" th:value="${user.employeeProfile?.relationWithEmployee}"></div>
                        <div class="field-group"><label class="field-label">Emergency Phone No.</label><div class="field-value" th:text="${user.employeeProfile?.emergencyPhone}"></div><input type="text" name="emergencyPhone" class="editable-input tracked-field" th:value="${user.employeeProfile?.emergencyPhone}" pattern="\d{10}"></div>
                        <div class="field-group"><label class="field-label">Alternate Phone No.</label><div class="field-value" th:text="${user.employeeProfile?.altMobile}"></div><input type="text" name="altMobile" class="editable-input tracked-field" th:value="${user.employeeProfile?.altMobile}" pattern="\d{10}"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

	function showTab(tabId, element){

	    document.querySelectorAll('.tab-content')
	        .forEach(tab => tab.classList.remove('active'));

	    document.querySelectorAll('.profile-tab')
	        .forEach(tab => tab.classList.remove('active'));

	    document.getElementById(tabId)
	        .classList.add('active');

	    element.classList.add('active');
	}	

    window.onload = function() {
        document.querySelectorAll('.field-value').forEach(div => {
            if (!div.innerText || div.innerText.trim() === "") {
                div.innerText = "-";
                div.style.color = "#94a3b8";
            }
        });
        calculateCompletion();
    };

    function calculateCompletion() {
        const trackedFields = document.querySelectorAll('.tracked-field');
        if (trackedFields.length === 0) return;

        let filled = 0;
        trackedFields.forEach(f => {
            if(f.value && f.value.trim() !== "") filled++;
        });

        let percent = Math.round((filled / trackedFields.length) * 100);
        document.getElementById('completionBar').style.width = percent + '%';
        document.getElementById('percentLabel').innerText = percent + '%';
    }

    function toggleEditMode() {
        const body = document.body;
        const btn = document.getElementById('editToggleBtn');
        const form = document.getElementById('fullProfileForm');

        if (!body.classList.contains('editing')) {
            // Enter Edit Mode
            body.classList.add('editing');
            btn.innerText = 'Save to My Profile';
            btn.classList.add('btn-success');
            btn.style.backgroundColor = '#10b981'; // Green
            
            // Clean up placeholders in input fields if they somehow got them
            document.querySelectorAll('.field-value').forEach(div => {
                if (div.innerText === "-") div.innerText = "";
            });
        } else {
            // Save logic
            if (form.checkValidity()) {
                form.submit();
            } else {
                form.reportValidity(); // Highlight required/pattern errors natively
            }
        }
    }
</script>
</body>
</html>
