<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pages/learning.css}">
</head>
<body data-page-id="dashboard">

    <!-- Sidebar -->
    <div th:replace="fragments/learning-sidebar :: learning-sidebar"></div>

    <!-- Main Content -->
    <div class="learning-main-content">
        <!-- Header -->
        <div th:replace="fragments/learning-header :: learning-header"></div>
        
        <div class="page-container">
            <h1 class="page-title">Welcome Back, <span th:text="${user != null and user.fullName != null and user.fullName.contains(' ') ? #strings.substringBefore(user.fullName, ' ') : (user != null ? user.fullName : 'Demo User')}">Rohit</span>! ðŸ‘‹</h1>
            
            <div class="dashboard-grid">
                <!-- Upcoming Events -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Upcoming Event & Seminars</h3>
                        <a href="#" class="view-all">View All</a>
                    </div>
                    <div class="events-wrapper" id="eventsContainer">
                        <!-- Populated by JS -->
                        <p style="color:gray;">Loading events...</p>
                    </div>
                </div>

                <!-- Recommended For You -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Recommended For You</h3>
                    </div>
                    <ul class="recommended-list" id="recommendedContainer">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>

            <div class="dashboard-row">
                <!-- Continue Learning -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Continue Learning</h3>
                    </div>
                    <div class="progress-list" id="continueContainer">
                        <!-- Populated by JS -->
                    </div>
                </div>


            </div>

            <div class="dashboard-bottom-grid">
                <!-- Explore Courses -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Explore Courses</h3>
                        <a href="/learning/explore-courses" class="view-all">View All</a>
                    </div>
                    <div class="course-grid" id="explorePreview">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Leaderboard -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Leaderboard</h3>
                    </div>
                    <div class="leaderboard-list" id="leaderboardPreview">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- API Integration -->
    <script th:src="@{/js/learning-api.js}"></script>
<script>
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('collapsed');
    }
</script>
</body>
</html>
