<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - WhiteCircle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: none;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            background: #fff;
        }
        .brand {
            color: #1e3a8a;
            font-weight: 700;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <div class="brand">WhiteCircle HRMS</div>
        <h5 class="text-center mb-4">Set Your Password</h5>
        <p class="text-muted text-center small mb-4">For security reasons, you must change your auto-generated password before accessing your dashboard.</p>
        
        <form action="/change-password" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small">New Password</label>
                <input type="password" class="form-control" name="newPassword" required minlength="6" placeholder="Enter new password">
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2">Update Password</button>
        </form>
    </div>

</body>
</html>
