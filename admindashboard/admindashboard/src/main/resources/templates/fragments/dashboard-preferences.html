<div th:fragment="preferences">
<!-- Dashboard Preference Modal -->
<div class="modal fade" id="prefModal" tabindex="-1" aria-labelledby="prefModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="prefModalLabel">Customize Dashboard</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Select up to 6 items to pin to your dashboard.</p>
        <form id="prefForm">
            <div id="prefCheckboxList" class="row">
                <!-- checkboxes injected via JS -->
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="savePreferences()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
    let userPinnedServices = "";
    let userPinnedApps = "";
    
    let currentPrefType = '';

    function rearrangeItems(type, pinnedString) {
        if (!pinnedString) return;
        const pinnedList = pinnedString.split(',').map(s => s.trim()).filter(s => s);
        if (pinnedList.length === 0) return;

        const pinnedContainer = document.getElementById(type === 'services' ? 'pinnedServicesContainer' : 'pinnedAppsContainer');
        const collapsedContainer = document.getElementById(type === 'services' ? 'collapsedServicesContainer' : 'collapsedAppsContainer');
        
        if (!pinnedContainer || !collapsedContainer) return;

        const allItems = Array.from(pinnedContainer.children).concat(Array.from(collapsedContainer.children));
        
        pinnedContainer.innerHTML = '';
        collapsedContainer.innerHTML = '';

        const pinnedNodes = [];
        const unpinnedNodes = [];

        allItems.forEach(item => {
            const span = item.querySelector('span[data-item-name]');
            if (span) {
                const name = span.getAttribute('data-item-name');
                if (pinnedList.includes(name)) {
                    pinnedNodes.push({item, index: pinnedList.indexOf(name)});
                } else {
                    unpinnedNodes.push(item);
                }
            } else {
                unpinnedNodes.push(item);
            }
        });

        pinnedNodes.sort((a, b) => a.index - b.index);
        
        const finalPinned = pinnedNodes.map(n => n.item).slice(0, 6);
        const overflowPinned = pinnedNodes.map(n => n.item).slice(6);
        const finalUnpinned = unpinnedNodes.concat(overflowPinned);

        finalPinned.forEach(node => pinnedContainer.appendChild(node));
        finalUnpinned.forEach(node => collapsedContainer.appendChild(node));
    }

    document.addEventListener("DOMContentLoaded", async function() {
        try {
            const res = await fetch('/api/user/preferences/dashboard');
            if (res.ok) {
                const data = await res.json();
                userPinnedServices = data.pinnedServices || "";
                userPinnedApps = data.pinnedApplications || "";
                rearrangeItems('services', userPinnedServices);
                rearrangeItems('apps', userPinnedApps);
            }
        } catch (e) {
            console.error("Failed to fetch preferences", e);
        }
    });

    function openPrefModal(type, event) {
        event.preventDefault();
        currentPrefType = type;
        const isServices = type === 'services';
        const pinnedContainer = document.getElementById(isServices ? 'pinnedServicesContainer' : 'pinnedAppsContainer');
        const collapsedContainer = document.getElementById(isServices ? 'collapsedServicesContainer' : 'collapsedAppsContainer');
        
        const allItems = Array.from(pinnedContainer.children).concat(Array.from(collapsedContainer.children));
        const listDiv = document.getElementById('prefCheckboxList');
        listDiv.innerHTML = '';
        
        const savedPref = isServices ? userPinnedServices : userPinnedApps;
        const pinnedList = savedPref ? savedPref.split(',').map(s => s.trim()) : [];
        
        let defaultPinned = [];
        if (!savedPref || pinnedList.length === 0) {
             defaultPinned = Array.from(pinnedContainer.children).map(node => {
                  const span = node.querySelector('span[data-item-name]');
                  return span ? span.getAttribute('data-item-name') : null;
             }).filter(n => n);
        }

        allItems.forEach(item => {
            const span = item.querySelector('span[data-item-name]');
            if (span) {
                const name = span.getAttribute('data-item-name');
                const labelText = span.innerText;
                
                const isChecked = (pinnedList.length > 0 && pinnedList.includes(name)) || 
                                  (pinnedList.length === 0 && defaultPinned.includes(name));
                                  
                listDiv.innerHTML += `
                    <div class="col-md-6 mb-2">
                        <div class="form-check">
                            <input class="form-check-input pref-checkbox" type="checkbox" value="${name}" id="chk_${name}" ${isChecked ? 'checked' : ''}>
                            <label class="form-check-label small" for="chk_${name}">${labelText}</label>
                        </div>
                    </div>
                `;
            }
        });

        const checkboxes = document.querySelectorAll('.pref-checkbox');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                const checkedCount = document.querySelectorAll('.pref-checkbox:checked').length;
                if (checkedCount > 6) {
                    this.checked = false;
                    Swal.fire('Limit Reached', 'You can only pin up to 6 items.', 'warning');
                }
            });
        });

        const myModal = new bootstrap.Modal(document.getElementById('prefModal'));
        myModal.show();
    }

    async function savePreferences() {
        const checkedBoxes = Array.from(document.querySelectorAll('.pref-checkbox:checked')).map(cb => cb.value);
        const joinedStr = checkedBoxes.join(',');
        
        const payload = {};
        if (currentPrefType === 'services') {
            payload.pinnedServices = joinedStr;
        } else {
            payload.pinnedApplications = joinedStr;
        }

        try {
            const response = await fetch('/api/user/preferences/dashboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                Swal.fire({
                    icon: 'success', title: 'Saved!', timer: 1500, showConfirmButton: false
                }).then(() => window.location.reload());
            } else {
                Swal.fire('Error', 'Failed to save preferences.', 'error');
            }
        } catch(e) {
            Swal.fire('Error', 'Network error', 'error');
        }
    }
</script>
</div>
