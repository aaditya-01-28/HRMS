<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - WhiteCircle Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e4e4e4;
        }
        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }
        .login-image-section {
            flex: 1.2;
            background: url('/images/wcg-building.png') center center/cover no-repeat;
            position: relative;
        }
        .login-form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 8%;
            background-color: #e4e4e4;
            position: relative;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            height: 80px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .welcome-text {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            color: #000;
        }
        .sub-text {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            font-size: 0.95rem;
        }
        .form-control {
            border: 1px solid #ccc;
            background-color: #d8d8d8;
            padding: 12px 15px;
            padding-left: 40px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #2962ff;
            box-shadow: 0 0 0 0.25rem rgba(41, 98, 255, 0.25);
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            z-index: 10;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 30px;
        }
        .btn-login {
            background-color: #2962ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 500;
            font-size: 1.1rem;
            width: 100%;
            display: block;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #1c44b2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(41, 98, 255, 0.3);
        }
        .back-link {
            text-align: center;
            display: block;
            margin-top: 20px;
            color: #333;
            font-weight: 500;
            text-decoration: none;
        }
        .back-link:hover {
            color: #2962ff;
            text-decoration: underline;
        }
        @media (max-width: 991px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image-section {
                flex: none;
                height: 30vh;
            }
            .login-form-section {
                padding: 40px 5%;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-image-section"></div>

    <div class="login-form-section">
        <div class="logo-container">
            <img src="/images/wcg-logo.jpg" alt="White Circle Group">
        </div>

        <h1 class="welcome-text">Forgot Password?</h1>
        <p class="sub-text">Enter your registered email address and we'll send you a link to reset your password.</p>

        <form action="/forgot-password" method="post" style="max-width: 400px; margin: 0 auto; width: 100%;">
            
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group-custom">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" class="form-control" placeholder="eg. abc123@gmail.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login">Send Reset Link</button>
            
            <a href="javascript:history.back()" class="back-link">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
