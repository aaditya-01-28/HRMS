<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Upcoming Trainings</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
		/* ======================================
		   GLOBAL
		====================================== */

		*{
		    margin:0;
		    padding:0;
		    box-sizing:border-box;
		    font-family:Arial,sans-serif;
		}

		body{
		    background:#f7f7f7;
		}

		/* ======================================
		   LAYOUT
		====================================== */

		.learning-dashboard{
		    display:flex;
		    min-height:100vh;
		}

		.dashboard-content{
		    flex:1;
		    padding:8px 35px 20px 35px;
		}

		/* ======================================
		   SIDEBAR
		====================================== */

		.sidebar{
		    width:245px;
		    background:#ffffff;
		    border-right:1px solid #d9d9d9;
		}

		.sidebar-header{
		    height:90px;
		    padding:15px;
		    display:flex;
		    align-items:center;
		    gap:12px;
		    border-bottom:1px solid #e5e5e5;
		}

		.company-logo{
		    width:45px;
		    height:45px;
		    object-fit:cover;
		}

		.company-details h3{
		    font-size:14px;
		    font-weight:700;
		    color:#000;
		}

		.company-details span{
		    font-size:11px;
		    color:#666;
		}

		.sidebar-menu{
		    padding-top:12px;
		}

		.menu-item{
		    height:42px;
		    display:flex;
		    align-items:center;
		    gap:12px;
		    padding:0 12px;
		    color:#222;
		    text-decoration:none;
		    font-size:13px;
		}

		.menu-item:hover{
		    background:#f3f4f6;
		}

		.menu-item.active{
		    background:#2d62ea;
		    color:#fff;
		}

		.menu-item i{
		    width:16px;
		}

		/* ======================================
		   HEADER
		====================================== */

		.dashboard-header{
		    display:flex;
		    justify-content:flex-end;
		    align-items:center;
		    gap:30px;
		    margin-bottom:8px;
		}

		.header-email{
		    display:flex;
		    align-items:center;
		    gap:8px;
		    color:#163f96;
		    font-size:14px;
		    font-weight:600;
		}

		.header-profile{
		    display:flex;
		    align-items:center;
		    gap:12px;
		}

		.profile-image{
		    width:42px;
		    height:42px;
		    border-radius:50%;
		    object-fit:cover;
		}

		.profile-info{
		    display:flex;
		    flex-direction:column;
		}

		.profile-name{
		    font-size:14px;
		    font-weight:700;
		    color:#222;
		}

		.profile-role{
		    font-size:12px;
		    color:#888;
		}

		/* ======================================
		   PAGE
		====================================== */

		.upcoming-training-container{
		    width:100%;
		}

		.page-title{
		    font-size:20px;
		    font-weight:700;
		    color:#14398b;
		    margin-bottom:50px;
		}

		/* ======================================
		   FILTERS
		====================================== */

		.training-filters{
		    display:flex;
		    align-items:center;
		    gap:18px;
		    margin-bottom:12px;
		}

		.filter-select{
		    width:180px;
		    height:38px;
		    border:1px solid #9d9d9d;
		    border-radius:4px;
		    background:#fff;
		    padding:0 12px;
		    font-size:14px;
		    color:#444;
		}

		.search-box{
		    width:215px;
		    height:38px;
		    border:1px solid #9d9d9d;
		    border-radius:4px;
		    background:#fff;

		    display:flex;
		    align-items:center;
		    gap:10px;

		    padding:0 12px;
		}

		.search-box i{
		    color:#555;
		}

		.search-box input{
		    border:none;
		    outline:none;
		    width:100%;
		    font-size:14px;
		}

		.schedule-btn{
		    margin-left:auto;

		    height:40px;
		    padding:0 18px;

		    border:none;
		    border-radius:4px;

		    background:#2d62ea;
		    color:white;

		    font-size:14px;
		    font-weight:700;

		    cursor:pointer;

		    display:flex;
		    align-items:center;
		    gap:8px;
		}

		.schedule-btn:hover{
		    background:#1d52d8;
		}

		/* ======================================
		   TABLE
		====================================== */

		.training-table{
		    border:1px solid #8f8f8f;
		    background:#fff;
		}

		.training-table-header{
		    display:grid;

		    grid-template-columns:
		        2fr
		        1.5fr
		        2fr
		        1.2fr
		        1.2fr
		        50px;

		    padding:10px 15px;

		    border-bottom:1px solid #8f8f8f;

		    font-size:14px;
		    font-weight:700;
		}

		.training-row{
		    display:grid;

		    grid-template-columns:
		        2fr
		        1.5fr
		        2fr
		        1.2fr
		        1.2fr
		        50px;

		    align-items:center;

		    min-height:65px;

		    padding:0 15px;

		    border-bottom:1px solid #d5d5d5;

		    font-size:14px;
		}

		.training-row:last-child{
		    border-bottom:none;
		}

		.training-action{
		    text-align:center;
		    cursor:pointer;
		    font-size:18px;
		    color:#1f2d5c;
		}

		/* ======================================
		   STATUS
		====================================== */

		.training-status{
		    font-weight:600;
		}

		.status-scheduled{
		    color:green;
		}

		.status-draft{
		    color:red;
		}
		
		/* ======================================
		   TRAINING MODAL
		====================================== */

		.training-modal{
		    display:none;
		    position:fixed;
		    inset:0;
		    background:rgba(0,0,0,0.35);
		    z-index:9999;

		    justify-content:center;
		    align-items:center;
		}

		.training-modal.show{
		    display:flex;
		}

		.training-modal-content{
		    width:850px;
		    background:#f7f7f7;
		    border-radius:8px;
		    padding:30px 40px;
		}

		.modal-title{
		    text-align:center;
		    color:#14398b;
		    font-size:20px;
		    font-weight:700;
		    margin-bottom:35px;
		}

		.training-form-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:60px;
		}

		.training-form-column{
		    display:flex;
		    flex-direction:column;
		    gap:22px;
		}

		.form-group{
		    display:flex;
		    flex-direction:column;
		}

		.form-group label{
		    margin-bottom:8px;
		    font-size:14px;
		    font-weight:700;
		}

		.required{
		    color:red;
		}

		.form-group input,
		.form-group select{
		    height:40px;
		    border:1px solid #9c9c9c;
		    border-radius:4px;
		    padding:0 12px;
		    background:white;
		}

		.form-group textarea{
		    height:110px;
		    resize:none;
		    border:1px solid #9c9c9c;
		    border-radius:4px;
		    padding:10px 12px;
		    background:white;
		}

		.modal-actions{
		    margin-top:35px;

		    display:flex;
		    justify-content:center;
		    gap:80px;
		}

		.cancel-btn{
		    width:180px;
		    height:50px;

		    border:1px solid #999;
		    border-radius:4px;

		    background:white;

		    font-size:18px;
		    font-weight:700;

		    cursor:pointer;
		}

		.save-btn{
		    width:180px;
		    height:50px;

		    border:none;
		    border-radius:4px;

		    background:#2d62ea;
		    color:white;

		    font-size:18px;
		    font-weight:700;

		    cursor:pointer;
		}
		.filter-btn{
		    height:40px;
		    padding:0 18px;
		    border:none;
		    border-radius:4px;
		    background:#14398b;
		    color:white;
		    cursor:pointer;
		    font-weight:600;
		}

		/* ======================================
		   EMPTY STATE
		====================================== */

		.empty-state{
		    text-align:center;
		    padding:50px;
		    color:#666;
		    font-size:14px;
		}

		/* ======================================
		   RESPONSIVE
		====================================== */

		@media(max-width:1200px){

		    .training-table{
		        overflow-x:auto;
		    }

		    .training-table-header,
		    .training-row{
		        min-width:950px;
		    }
		}
	</style>

</head>

<body>

	<div class="learning-dashboard">
	
	    <!-- SIDEBAR -->
	
	    <aside class="sidebar">
	
	        <div class="sidebar-header">
	
	            <img src="/images/wcg-logo.jpg"
	                 class="company-logo"
	                 alt="Logo">
	
	            <div class="company-details">
	
	                <h3>WhiteCircle</h3>
	
	                <span>Learning Admin</span>
	
	            </div>
	
	        </div>
	
	        <nav class="sidebar-menu">
	
	            <a href="/space/lnd/dashboard"
	               class="menu-item">
	
	                <i class="fa-solid fa-house"></i>
	
	                <span>Home</span>
	
	            </a>
	
	            <a href="/space/lnd/approvals"
	               class="menu-item">
	
	                <i class="fa-regular fa-square-check"></i>
	
	                <span>Approvals</span>
	
	            </a>
	
	            <a href="/space/lnd/course-addition"
	               class="menu-item">
	
	                <i class="fa-solid fa-book-open"></i>
	
	                <span>Course Addition</span>
	
	            </a>
	
				<a href="/space/lnd/upcoming-training"
				   class="menu-item active">

				    <i class="fa-regular fa-calendar-days"></i>

				    <span>Upcoming Training</span>

				</a>
	
	        </nav>
	
	    </aside>
	
	    <!-- MAIN CONTENT -->
	
	    <main class="dashboard-content">
	
	        <!-- HEADER -->
	
	        <header class="dashboard-header">
	
	            <div class="header-email">
	
	                <i class="fa-regular fa-envelope"></i>
	
	                <span th:text="${loggedInEmail}">
	                </span>
	
	            </div>
	
	            <div class="header-profile">
	
	                <img src="/images/wcg-logo.jpg"
	                     class="profile-image">
	
	                <div class="profile-info">
	
	                    <div class="profile-name"
	                         th:text="${loggedInUserName}">
	                    </div>
	
	                    <div class="profile-role">
	                        Learning Admin
	                    </div>
	
	                </div>
	
	            </div>
	
	        </header>
	
	        <!-- PAGE -->
	
	        <div class="upcoming-training-container">
	
	            <h1 class="page-title">
	                Upcoming Trainings
	            </h1>
	
	            <!-- FILTERS -->
	
	            <form method="get"
	                  action="/space/lnd/upcoming-training"
	                  class="training-filters">
	
					  <select name="trainingType"
					          class="filter-select">

					      <option value="">
					          All Trainings
					      </option>

					      <option th:each="type : ${trainingTypes}"
					              th:value="${type}"
					              th:text="${type}">
					      </option>

					  </select>
	
					  <select name="status"
					          class="filter-select">

					      <option value="">
					          Status: All
					      </option>

					      <option value="SCHEDULED">
					          Scheduled
					      </option>

					      <option value="COMPLETED">
					          Completed
					      </option>

					  </select>
	
	                <div class="search-box">
	
	                    <i class="fa-solid fa-magnifying-glass"></i>
	
	                    <input type="text"
	                           name="search"
	                           placeholder="Search by name">
	
	                </div>
					<button type="submit"
					        class="filter-btn">

					    Filter

					</button>
	
	                <button type="button"
	                        class="schedule-btn"
	                        onclick="openTrainingModal()">
	
	                    <i class="fa-solid fa-plus"></i>
	
	                    Schedule New
	
	                </button>
					
	
	            </form>
	            <!-- TABLE -->

	            <div class="training-table">

	                <div class="training-table-header">

	                    <div>Title Name</div>

	                    <div>Date</div>

	                    <div>Trainer</div>

	                    <div>Duration</div>

	                    <div>Status</div>

	                    <div></div>

	                </div>

	                <div class="training-table-body">

	                    <div class="training-row"
	                         th:each="training : ${trainings}">

	                        <div th:text="${training.title}">
	                        </div>

	                        <div th:text="${training.trainingDate}">
	                        </div>

	                        <div th:text="${training.trainerName}">
	                        </div>

	                        <div>

	                            <span th:text="${training.duration}">
	                            </span>

	                            hrs

	                        </div>

	                        <div>

	                            <span class="training-status"
	                                  th:text="${training.status}">
	                            </span>

	                        </div>

	                        <div class="training-action">

	                            <i class="fa-solid fa-ellipsis-vertical"></i>

	                        </div>

	                    </div>

	                    <div class="empty-state"
	                         th:if="${trainings == null || trainings.isEmpty()}">

	                        No Trainings Available

	                    </div>

	                </div>

	            </div>

	        </div>

	    </main>

	</div>
	<!-- SCHEDULE TRAINING MODAL -->

	<div id="scheduleTrainingModal" class="training-modal">

	    <div class="training-modal-content">

	        <h2 class="modal-title">

	            Schedule New Training

	        </h2>

			<form class="training-form"
			      method="post"
			      action="/space/lnd/training/save">

	            <div class="training-form-grid">

	                <!-- LEFT -->

	                <div class="training-form-column">

	                    <div class="form-group">

	                        <label>

	                            Training Title

	                            <span class="required">*</span>

	                        </label>

	                        <input type="text"
	                               name="title"
	                               placeholder="Enter training title">

	                    </div>

	                    <div class="form-group">

	                        <label>

	                            Trainer Name

	                            <span class="required">*</span>

	                        </label>

	                        <input type="text"
	                               name="trainerName"
	                               placeholder="Enter trainer name">

	                    </div>

	                    <div class="form-group">

	                        <label>

	                            Training Type

	                            <span class="required">*</span>

	                        </label>

	                        <select name="trainingType">

	                            <option value="">
	                                Select Type
	                            </option>

	                            <option value="Seminar">
	                                Seminar
	                            </option>

	                            <option value="Workshop">
	                                Workshop
	                            </option>

	                            <option value="Certification">
	                                Certification
	                            </option>

	                        </select>

	                    </div>

	                </div>

	                <!-- RIGHT -->

	                <div class="training-form-column">

	                    <div class="form-group">

	                        <label>

	                            Training Date

	                            <span class="required">*</span>

	                        </label>

	                        <input type="date"
	                               name="trainingDate">

	                    </div>

	                    <div class="form-group">

	                        <label>

	                            Duration (hrs)

	                            <span class="required">*</span>

	                        </label>

	                        <input type="number"
	                               name="duration"
	                               placeholder="Enter duration">

	                    </div>

	                    <div class="form-group">

	                        <label>

	                            Description

	                            <span class="required">*</span>

	                        </label>

	                        <textarea name="description"
	                                  maxlength="500"
	                                  placeholder="Enter description"></textarea>

	                    </div>

	                </div>

	            </div>

	            <div class="modal-actions">

	                <button type="button"
	                        class="cancel-btn"
	                        onclick="closeTrainingModal()">

	                    Cancel

	                </button>

	                <button type="submit"
	                        class="save-btn">

	                    Schedule

	                </button>

	            </div>

	        </form>

	    </div>

	</div>
<script>

	function openTrainingModal() {

	    document
	        .getElementById("scheduleTrainingModal")
	        .classList
	        .add("show");
	}

	function closeTrainingModal() {

	    document
	        .getElementById("scheduleTrainingModal")
	        .classList
	        .remove("show");
	}

</script>
</body>

</html>
