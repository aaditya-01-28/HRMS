<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Hospital | WhiteCircle Health</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    

    <style>
        :root {
            --med-primary: #1E88E5;
            --med-green: #43A047;
            --med-orange: #FB8C00;
            --bg-color: #f4f7fb;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

		*{
		    margin:0;
		    padding:0;
		    box-sizing:border-box;
		    
		}

		body{
		    background:#F3F4F6;
		    font-family:Arial, sans-serif;
		    font-size:14px;
		    color:#111827;
		}

		.dashboard-wrapper{
		    display:flex;
		    min-height:100vh;
		}

		/* SIDEBAR */

		.sidebar{
		    width:250px;
		    background:#001A57;
		    padding:24px 10px;
		    flex-shrink:0;
		}

		.sidebar-logo{
		    text-align:center;
		    margin-bottom:40px;
		}

		.sidebar-logo img{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.sidebar-menu{
		    display:flex;
		    flex-direction:column;
		    gap:12px;
		}

		.menu-item{
		    display:flex;
		    align-items:center;
		    gap:6px;

		    color:white;
		    text-decoration:none;

		    padding:10px 12px;

		    border-radius:10px;

		    font-size:14px;
		    font-family:Arial, sans-serif;
		}

		.menu-item.active{
		    background:#2E63FF;
		}

		.menu-item:hover{
		    background:#2E63FF;
		}

		/* MAIN */

		.main-section{
		    flex:1;
		}

		.top-header{
		    height:90px;

		    background:#F3F4F6;

		    border-bottom:2px solid #CBD5E1;

		    display:flex;
		    align-items:center;
		    justify-content:space-between;

		    padding:0 28px;
		}

		.header-left{
		    display:flex;
		    align-items:center;
		    gap:12px;
		}

		.header-icon{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.header-left h1{
		    font-size:20px;
		    font-family:Arial, sans-serif;
		    font-weight:700;
		    color:#0B2E7A;
		}

		.back-home-btn{
		    background:#2E63FF;
		    color:white;

		    text-decoration:none;

		    padding:14px 28px;

		    border-radius:10px;

		    font-size:14px;
		    font-weight:700;
		    font-family:Arial, sans-serif;
		}

		/* HOSPITAL TABLE */

		.hospital-table{
		    width:80%;
		    border-collapse:collapse;
		    background:transparent;
		    margin-top:20px;
		}

		.hospital-table th{
		    font-family:Arial,sans-serif;
		    font-size:20px;
		    font-weight:700;
		    color:#0B2E7A;
		    text-align:center;
			vertical-align:middle;
		    padding:16px 20px;

		    border:1px solid #BDBDBD;
		}

		.hospital-table td{
		    font-family:Arial,sans-serif;
		    font-size:14px;
			text-align:center;
			vertical-align:middle;
		    padding:16px 20px;
		    border:1px solid #BDBDBD;

		    vertical-align:middle;
		}

		.hospital-table tbody tr:hover{
		    background:transparent;
		}

		.empty-state{
		    text-align:center;
		    padding:30px !important;
		    font-size:14px;
		}
		
		.cashless-yes{
		    color:#16A34A;
		    font-weight:700;
		}

		.cashless-no{
		    color:#EF4444;
		    font-weight:700;
		}

		/* CONTENT */

		.dashboard-content{
		    padding:24px 28px;
		}

		/* SEARCH */

		.search-wrapper{
		    width:380px;
		    height:50px;

		    background:#EFEAF5;

		    border-radius:25px;

		    display:flex;
		    align-items:center;

		    padding:0 20px;

		    box-shadow:0 2px 8px rgba(0,0,0,0.12);

		    margin-bottom:35px;
		}

		.search-icon{
		    color:#222;
		    font-size:20px;
		    margin-right:12px;
		}

		.hospital-search{
		    flex:1;

		    border:none;
		    outline:none;

		    background:transparent;

		    font-size:14px;
		    font-family:Arial, sans-serif;

		    color:#111827;
		}

		.hospital-search::placeholder{
		    color:#666;
		}

		
     </style>
</head>
<body>

	<div class="dashboard-wrapper">

	    <!-- SIDEBAR -->

	    <div class="sidebar">

	        <div class="sidebar-logo">
	            <!-- Add logo later -->
				<img th:src="@{/images/wcg-logo.jpg}"
				     alt="WhiteCircle"
				     class="sidebar-logo">
	        </div>

	        <div class="sidebar-menu">

	            <a href="/employee/mediclaim/portal"
	               class="menu-item">

	                <i class="fa-solid fa-table-columns"></i>

	                Dashboard
	            </a>

				<a href="/employee/mediclaim/policy"
				   class="menu-item">

	                <i class="fa-solid fa-file-shield"></i>

	                Coverage
	            </a>

	            <a href="/employee/mediclaim/track/list"
	               class="menu-item active">

	                <i class="fa-solid fa-file-medical"></i>

	                Claims
	            </a>

				<a href="/employee/mediclaim/helpdesk"
				   class="menu-item">

	                <i class="fa-solid fa-circle-question"></i>

	                Help center
	            </a>

	        </div>

	    </div>

	    <!-- MAIN -->

	    <div class="main-section">

	        <!-- HEADER -->

	        <div class="top-header">

	            <div class="header-left">

	                <!-- Add icon later -->
	                <img src=""
	                     alt="Mediclaim"
	                     class="header-icon">

	                <h1>

	                    My Mediclaims

	                </h1>

	            </div>

	            <a href="/employee/mediclaim/portal"
	               class="back-home-btn">

	                Back to Dashboard

	            </a>

	        </div>

	        <!-- CONTENT -->

	        <div class="dashboard-content">

	            <!-- SEARCH -->

	            <div class="search-wrapper">

	                <i class="fa-solid fa-magnifying-glass search-icon"></i>

	                <input type="text"
	                       id="searchInput"
	                       class="hospital-search"
	                       placeholder="Search Hospitals">

	            </div>

	            <!-- TABLE -->

	            <table class="hospital-table">

	                <thead>

	                <tr>

	                    <th>Hospital Name</th>

	                    <th>City</th>

	                    <th>Cashless Available</th>

	                </tr>

	                </thead>

	                <tbody id="hospitalTableBody">

	                <tr th:each="hospital : ${hospitals}"
	                    class="hospital-row">

	                    <td class="hospital-name"
	                        th:text="${hospital.name}">

	                        Hospital

	                    </td>

	                    <td class="hospital-location"
	                        th:text="${hospital.location}">

	                        City

	                    </td>

						<td>
						    <span th:text="${hospital.cashless ? 'Yes' : 'No'}"
						          th:class="${hospital.cashless} ? 'cashless-yes' : 'cashless-no'">
						        Yes
						    </span>
						</td>

	                </tr>

	                <tr th:if="${hospitals == null or hospitals.empty}">

	                    <td colspan="3"
	                        class="empty-state">

	                        No hospitals available.

	                    </td>

	                </tr>

	                </tbody>

	            </table>

	        </div>

	    </div>

	</div>

<script>

	document.getElementById('searchInput')
	        .addEventListener('keyup', function () {

	    const value = this.value.toLowerCase();

	    const rows = document.querySelectorAll('.hospital-row');

	    rows.forEach(row => {

	        const name = row.querySelector('.hospital-name')
	                        .innerText.toLowerCase();

	        const city = row.querySelector('.hospital-location')
	                        .innerText.toLowerCase();

	        if (name.includes(value) || city.includes(value)) {

	            row.style.display = '';

	        } else {

	            row.style.display = 'none';

	        }

	    });

	});

    let currentFilterType = 'all';

    // Updates the active chip styling and stores the current filter type
    function setFilter(type, element) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        currentFilterType = type;
        applyFilters();
    }

    // Trigger search when typing
    document.getElementById('searchInput').addEventListener('keyup', applyFilters);

    // Combined filtering logic (Type + Text Search)
    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.hospital-card-wrapper');
        let visibleCount = 0;

        cards.forEach(card => {
            // Check Type Filter
            const typeMatch = (currentFilterType === 'all') || card.getAttribute('data-type').includes(currentFilterType);

            // Check Text Search (searches both name and location)
            const name = card.querySelector('.hospital-name').innerText.toLowerCase();
            const location = card.querySelector('.hospital-location').innerText.toLowerCase();
            const textMatch = name.includes(searchTerm) || location.includes(searchTerm);

            if (typeMatch && textMatch) {
                card.style.display = 'block';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        // Show/Hide Empty State Message
        const emptyState = document.getElementById('noResultsMessage');
        if (visibleCount === 0 && cards.length > 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
        }
    }
</script>
</body>
</html>
