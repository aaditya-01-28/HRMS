<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WhiteCircle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">

    <style>
        :root {
            --bs-primary: #1e3a8a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 80px; 
            background-image: url('/images/wcg-building.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .bg-overlay {
            position: fixed;
            top: 80px; left: 0; right: 0; bottom: 0;
            background: rgba(220, 226, 245, 0.85);
            z-index: -1;
        }

        .top-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: #f1f5f9;
            height: 80px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px;
            border-bottom: 4px solid #3b82f6;
        }

        .brand-section {
            display: flex; align-items: center; gap: 15px;
            color: #0b2471;
            font-weight: 800;
            font-size: 1.8rem;
        }
        
        .brand-icon-wrapper {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            display: flex; align-items: center; justify-content: center;
            color: #3b82f6;
            font-size: 1.5rem;
            position: relative;
        }

        .btn-back-home, .btn-back {
            background: #1e3a8a; color: white;
            padding: 12px 30px; border-radius: 8px; font-size: 1.2rem; font-weight: 600; text-decoration: none;
            border: none; transition: background 0.2s;
        }
        .btn-back-home:hover, .btn-back:hover { background: #1d4ed8; color: white; }

        .form-container {
            padding: 40px 20px;
            max-width: 450px;
            margin: 40px auto 0; /* Centers horizontally */
        }

        .card-header-text {
            color: #0b2471;
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .form-label {
            font-weight: 700;
            color: #000;
            font-size: 1.3rem;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-label sup {
            font-size: 1.5rem;
            top: -0.3em;
        }

        .input-group {
            width: 100%;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 8px 0 0 8px;
            padding: 12px 15px;
            border: 1px solid #94a3b8;
            font-size: 1.1rem;
            border-right: none;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #3b82f6;
        }

        .btn-reveal {
            border-radius: 0 8px 8px 0;
            border: 1px solid #94a3b8;
            background: white;
            border-left: none;
            color: #64748b;
            padding: 0 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .form-control:focus + .btn-reveal {
            border-color: #3b82f6;
        }

        .req-list {
            display: flex; flex-wrap: wrap; gap: x; row-gap: 5px; column-gap: 15px;
            padding: 0; list-style: none; margin-top: 5px; width: 100%;
            margin-bottom: 25px;
            justify-content: center; /* Center the checklist */
        }
        .req-item {
            font-size: 0.75rem; font-weight: 600; color: #64748b;
            display: flex; align-items: center;
        }
        .req-item i { margin-right: 5px; font-weight: bold; }
        .req-item.valid { color: #000; }
        
        .button-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-update {
            background: #1e3a8a;
            color: white;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 1.3rem;
            border: none;
            width: 100%;
        }
        .btn-update:hover { background: #1d4ed8; }

        .btn-cancel {
            background: white;
            color: #000;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 1.3rem;
            width: 100%;
            text-decoration: none;
            text-align: center;
        }
        .btn-cancel:hover { background: #f8fafc; color: #000; }

        /*  PREMIUM SWEETALERT2 STYLING  */
        div:where(.swal2-container) { font-family: 'Inter', sans-serif !important; }
        .swal2-popup { border-radius: 20px !important; padding: 2em !important; }
        .swal2-title { color: #1e3a8a !important; font-weight: 800 !important; }
        .swal2-confirm { border-radius: 10px !important; padding: 12px 30px !important; font-weight: 700 !important; }
        .swal2-toast { border-radius: 12px !important; padding: 15px 20px !important; box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important; }

        @media (max-width: 768px) {
            body {
                padding-top: 70px !important;
            }
            .bg-overlay {
                top: 60px !important;
            }
            .top-header, .top-nav-bar {
                height: auto !important;
                padding: 12px 15px !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                display: flex !important;
            }
            .top-header .page-title i, .top-nav-bar .page-title i {
                font-size: 1.5rem !important;
            }
            .top-header .page-title span, .top-nav-bar .page-title span {
                font-size: 1.1rem !important;
                margin-left: 8px !important;
                padding-left: 8px !important;
            }
            .btn-back-home, .btn-back {
                padding: 6px 12px !important;
                font-size: 0.8rem !important;
            }
            .form-container {
                margin-top: 15px !important;
                padding: 20px 10px !important;
            }
            .card-header-text {
                font-size: 1.4rem !important;
                margin-bottom: 20px !important;
            }
            .form-label {
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<header class="top-header">
    <div class="page-title d-flex align-items-center">
        <i class="fas fa-sync-alt text-dark" style="font-size: 2.5rem;"></i>
        <span class="fw-bold text-dark" style="border-left: 2px solid #cbd5e1; padding-left: 17px; margin-left: 15px; font-size: 1.5rem; letter-spacing: 0.5px;">
            Reset Password
        </span>
    </div>
    <a href="/login" class="btn-back-home">
        <i class="fas fa-arrow-left me-2"></i> Back to Login
    </a>
</header>

<div class="form-container">
    <h4 class="card-header-text">Create New Password</h4>

    <form action="/api/reset-password" method="POST" class="needs-validation" novalidate>

        <input type="hidden" name="token" th:value="${token}" />

        <div class="mb-1">
            <label class="form-label">New Password <sup>*</sup></label>
            <div class="input-group">
                <input type="password" name="password" class="form-control" id="newPass" onkeyup="checkStrength()" required>
                <button class="btn btn-reveal" type="button" onclick="togglePass('newPass', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <ul class="req-list">
                <li class="req-item" id="req-len"><i class="fas fa-check"></i> 8+ chars</li>
                <li class="req-item" id="req-num"><i class="fas fa-check"></i> Numbers</li>
                <li class="req-item" id="req-sym"><i class="fas fa-check"></i> Symbol</li>
                <li class="req-item" id="req-cap"><i class="fas fa-check"></i> Both uppercase and lowercase</li>
            </ul>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm New Password <sup>*</sup></label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirmPass" required>
                <button class="btn btn-reveal" type="button" onclick="togglePass('confirmPass', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="button-container">
            <button type="submit" class="btn-update">Update Password</button>
            <a href="/login" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    function togglePass(inputId, btnEl) {
        const input = document.getElementById(inputId);
        const icon = btnEl.querySelector('i');
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3500,
        timerProgressBar: true,
        background: '#ffffff',
        color: '#334155',
        didOpen: (toast) => {
            toast.addEventListener('mouseenter', Swal.stopTimer)
            toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
    });

    document.querySelector('form').addEventListener('submit', function(e) {
        if (!this.checkValidity()) {
            e.preventDefault();
            Toast.fire({ icon: 'warning', title: 'Please fill in all required fields.' });
            return;
        }

        const newPass = document.getElementById('newPass').value;
        const confirmPass = document.getElementById('confirmPass').value;

        if (newPass !== confirmPass) {
            e.preventDefault();
            Toast.fire({ icon: 'warning', title: 'New Passwords do not match!' });
            return;
        }

        const score = document.querySelectorAll('.req-item.valid').length;
        if (score < 4) {
             e.preventDefault();
             Toast.fire({ icon: 'info', title: 'Please meet all security requirements.' });
             return;
        }

        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';
    });

    function checkStrength() {
        const password = document.getElementById('newPass').value;

        const hasLen = password.length >= 8;
        const hasNum = /\d/.test(password);
        const hasSym = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        const hasCapLower = /[A-Z]/.test(password) && /[a-z]/.test(password);

        updateReq('req-len', hasLen);
        updateReq('req-num', hasNum);
        updateReq('req-sym', hasSym);
        updateReq('req-cap', hasCapLower);
    }

    function updateReq(id, isValid) {
        const el = document.getElementById(id);
        if(isValid) {
            el.classList.add('valid');
        } else {
            el.classList.remove('valid');
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
