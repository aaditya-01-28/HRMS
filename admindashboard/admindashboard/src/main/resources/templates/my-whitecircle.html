<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WhiteCircle - Quick Actions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    

    <style>
		:root {
		    --bs-primary: #0066ff; 
		    --bg-color: #dcdcdc;  
		    --card-bg: #bcbcbc;   
		    --card-border: #666666;
		}

		* {
			box-sizing: border-box;
			font-family: Arial, sans-serif !important;
			border-radius: 0 !important;
		}

		body, button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, a {
			font-family: Arial, sans-serif !important;
		}

		.card, .btn, .btn-back-hub, .btn-circular-back-hub, .modal-content, .alert {
			border-radius: 0 !important;
		}

		body {
			font-family: Arial, sans-serif;
			font-size: 14px;
		    background-color: var(--bg-color);
		    color: #000000;
		    overflow-x: hidden;
		    margin: 0;
		    padding: 0;
		}

		/* --- MOCKUP HEADER BAR --- */
		/* --- SINGLE CARD HEADER NAVIGATION FIX --- */
		.top-header {
		    background: white;
		    padding: 15px 40px;
		    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
		    display: flex; justify-content: flex-start; align-items: center;
		    height: 90px;
		}
		.btn-circular-back-hub {
		    margin-left: auto;
		    
		}
		.btn-back-hub {
		    margin-left: auto;
		    background-color: #0066ff;
		    color: #ffffff !important;
		    text-decoration: none;
		    padding: 8px 16px;
		    border-radius: 6px;
		    font-family: Arial, sans-serif;
		    font-size: 14px;
		    font-weight: 600;
		    display: flex;
		    align-items: center;
		    gap: 6px;
		}

		.btn-back-hub:hover {
		    background-color: #0052cc;
		    color: #ffffff !important;
		}
		
		.top-header {
		    background: white;
		    padding: 15px 40px;
		    position: fixed;
		    top: 0;
		    left: 0;
		    right: 0;
		    z-index: 1000;

		    display: flex;
		    justify-content: space-between;
		    align-items: center;

		    height: 90px;
		}

		.header-left {
		    display: flex;
		    align-items: center;
		}

		.mockup-badge-container {
		    display: flex;
		    align-items: center;
		    justify-content: center;

		    padding-right: 15px;
		    margin-right: 15px;

		    border-right: 2px solid #000;
		    height: 42px;
		}

		.mockup-icon-card-only {
		    font-size: 1.7rem !important;
		    color: #000 !important;
		}

		.header-title-text {
		    font-family: Arial, sans-serif;
		    font-size: 20px;
		    font-weight: 700;
		    color: #000;
		}

		/* Sizing wrapper for the single card and divider line */
		.mockup-badge-container {
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    padding-right: 25px; /* Creates clean spacing before the vertical line */
		    /* This creates the crisp vertical divider line from your mockup */
		    border-right: 2px solid #000000; 
		    height: 42px; 
		    flex-shrink: 0;
		}

		/* Bold layout for the single card icon */
		.mockup-icon-card-only {
		    font-size: 1.8rem !important; /* Made larger and bolder to fill out the workspace layout */
		    color: #000000 !important;
		    display: inline-block;
		    line-height: 1;
		}

		
		.header-title-text,
		.section-headline-title {
		    font-size: 20px;
		    font-weight: 700;
		}
		/* --- CONTENT MAIN WRAPPER CANVAS --- */
		.main-content-canvas {
		    margin-top: 150px;
		    max-width: 1200px;
		    margin-left: auto;
		    margin-right: auto;
		    padding: 0 25px 60px 25px;
		}

		.section-headline-title {
			font-size: 20px;
			font-weight: 700;
		    color: #000000;
		    margin-bottom: 35px;
		    position: relative;
		    display: inline-block;
		}
		.section-headline-title::after {
		    content: '';
		    position: absolute;
		    left: 0;
		    bottom: -6px;
		    width: 75px; 
		    height: 3px;
		    background-color: #0066ff;
		}

		/* --- ENHANCED GRID ITEM ROW GAP --- */
		
		.custom-grid-row {
		    row-gap: 55px !important; /* Adjust this number higher or lower to get your perfect spacing */
		}
		

		/* --- ACTION BOX MATRIX CARDS --- */
		.action-box {
		    background: var(--card-bg); 
		    border: 1px solid var(--card-border);
		    border-radius: 16px; 
		    padding: 20px 10px;
		    text-align: center;
		    height: 140px; 
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		    gap: 12px;
		    cursor: pointer;
		    transition: background-color 0.15s, transform 0.1s;
		}
		.action-box:hover {
		    background-color: #b0b0b0;
		    transform: scale(1.02);
		}

		.icon-wrapper-flat {
		    color: #000000;
		    font-size: 2.2rem;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		}

		.box-title {
			font-size: 14px;
			font-weight: 600;
		    color: #000000;
		    
		    line-height: 1.2;
		}
		

		
    </style>

    <style>
        @media (max-width: 991px) {
            .top-header {
                padding: 10px 15px !important;
                height: 64px !important;
            }
            .btn-circular-back-hub { width: 30px !important; height: 30px !important; font-size: 0.85rem !important; margin-right: 8px !important; }
            .btn-back-hub {
                padding: 6px 12px !important;
                font-size: 12px !important;
            }
            .mockup-badge-container { width: 30px !important; height: 26px !important; margin-right: 8px !important; padding-right: 8px !important; }
            .mockup-icon-user { font-size: 1.2rem !important; }
            .mockup-icon-card { font-size: 1rem !important; }
            .header-separator { margin-right: 10px !important; height: 20px !important; }
            .header-title-text { font-size: 1.1rem !important; }
            .main-content-canvas { margin-top: 80px !important; padding: 0 16px !important; }
            .section-headline-title { font-size: 1.1rem !important; margin-bottom: 16px !important; }
            .action-box { height: 110px !important; border-radius: 12px !important; padding: 12px 6px !important; gap: 8px !important; }
            .icon-wrapper-flat { font-size: 1.6rem !important; }
            .box-title { font-size: 0.8rem !important; }
            .custom-grid-row {
                row-gap: 16px !important;
            }
        }
        @media (max-width: 576px) {
            .custom-grid-row {
                row-gap: 12px !important;
            }
            .action-box {
                height: 100px !important;
                padding: 10px 4px !important;
            }
            .icon-wrapper-flat {
                font-size: 1.4rem !important;
            }
            .box-title {
                font-size: 0.72rem !important;
            }
        }
    </style>
    <link href="/css/dark-mode.css" rel="stylesheet">
    <script src="/js/theme-engine.js"></script>
</head>
<body>

<header class="top-header">

    <div class="header-left">
        <div class="mockup-badge-container">
            <i class="fa-solid fa-address-card mockup-icon-card-only"></i>
        </div>

        <div class="header-title-text">My WhiteCircle</div>
    </div>

    <a href="/my-whitecircle/login" class="btn-back-hub">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>

</header>
<main class="main-content-canvas">
    <h5 class="section-headline-title">Quick Actions</h5>

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 gx-4 custom-grid-row">
        <div class="col">
            <div class="action-box" onclick="window.location.href='/leave-management?source=whitecircle'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="box-title">Leave Request</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/profile?source=whitecircle'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-user-gear"></i></div>
                <div class="box-title">View Profile</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/organization-structure?source=whitecircle'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-sitemap"></i></div>
                <div class="box-title">Org. Chart</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/timesheet-report?source=whitecircle'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="box-title">TimeSheet</div>
            </div>
        </div>

		<div class="col">
		    <div class="action-box"
		         onclick="window.location.href='/employee/my-goals'">

		        <div class="icon-wrapper-flat">
		            <i class="fa-solid fa-bullseye"></i>
		        </div>

		        <div class="box-title">
		            Manage Goal
		        </div>

		    </div>
		</div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/learning/dashboard'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="box-title">View Learning</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/activate-mobile'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="box-title">Activate Mobile</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/my-approvals'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-list-check"></i></div>
                <div class="box-title">Pending Workflows</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/notifications'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-bell"></i></div>
                <div class="box-title">View Reminder</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/favourites'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-star"></i></div>
                <div class="box-title">View Favourite</div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
