<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteCircle Group | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        #login-container {
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            min-height: 600px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            /* Fine edge square shape */
            border-radius: 0;
            border: 1px solid #dee2e6;
        }

        .left-side {
            height: 100%;
            padding: 0;
        }
        
        .left-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .right-side {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            background-color: white;
        }

        .form-control::placeholder {
            color: #adb5bd !important;
            opacity: 0.8;
            font-weight: 400;
        }
        
        .input-group > .input-group-text, .input-group > .form-control, .input-group > .btn {
            border-color: #6c757d;
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
            border-radius: 0 !important; /* Square edges */
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #0f172a;
        }
        
        .btn-toggle-password {
            color: #6c757d;
        }
        .btn-toggle-password:hover {
            background-color: #e9ecef;
            color: #343a40;
        }

        .login-btn {
            background-color: #0f172a;
            color: white;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: none;
        }
        
        .login-btn:hover {
            background-color: #1e293b;
            color: white;
        }

        .logo-img {
            height: 120px; 
            width: auto;
        }

        hr.divider {
            width: 40%;
            margin: 25px auto;
            border-top: 1px solid #000;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<div id="login-container" class="row g-0">
    <!-- LEFT SIDE: RECEPTION IMAGE -->
    <div class="col-lg-6 d-none d-lg-block left-side p-3 pe-0">
        <img src="/images/Reception.png" alt="Reception">
    </div>

    <!-- RIGHT SIDE: LOGIN FORM -->
    <div class="col-12 col-lg-6 right-side">
        
        <!-- Flash Messages -->
        <div th:if="${param.error}" class="alert alert-danger rounded-0 border-0 mb-4" style="background-color: #fee2e2; color: #b91c1c;">
            <i class="fas fa-exclamation-circle me-2"></i> Invalid credentials.
        </div>
        <div th:if="${param.logout}" class="alert alert-success rounded-0 border-0 mb-4" style="background-color: #dcfce7; color: #15803d;">
            <i class="fas fa-check-circle me-2"></i> Logged out successfully.
        </div>

        <div class="text-center mb-4">
            <img src="/images/white_bg_logo.png" alt="WhiteCircle Group" class="logo-img">
            <hr class="divider">
        </div>

        <div class="px-xl-5 px-md-4">
            <form action="/perform_login" method="post">
                <input type="hidden" name="portalType" value="employee">
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark fs-6">User ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-dark border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-dark border-start-0 ps-2 fw-semibold" placeholder="e.g. EMP114 or EMP002" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-dark fs-6">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-dark border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="employeePassword" class="form-control border-dark border-start-0 border-end-0 ps-2 fw-semibold" placeholder="••••••••••" required>
                        <button class="btn border-dark border-start-0 bg-white text-muted btn-toggle-password" type="button" onclick="togglePassword('employeePassword', 'eyeIconEmp')">
                            <i class="fas fa-eye-slash" id="eyeIconEmp"></i>
                        </button>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-5 mt-3">
                    <div class="form-check">
                        <input class="form-check-input border-dark rounded-0" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-dark fw-semibold small" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="/forgot-password" class="text-decoration-none small" style="color: #ef4444;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn w-100 py-2 fw-bold fs-5 shadow-sm login-btn">
                    Login <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-5">
            <small class="text-muted">Need help? Contact <a href="#" class="text-decoration-none" style="color: #2563eb; font-weight: 600;">IT Support</a></small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        }
    }
</script>
</body>
</html>
