<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Control Center | WhiteCircle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --med-primary: #1E88E5;
            --med-primary-dark: #1565C0;
            --med-green: #43A047;
            --med-orange: #FB8C00;
            --med-red: #E53935;
            --bg-color: #f4f7fb;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

		*{
		    margin:0;
		    padding:0;
		    box-sizing:border-box;
		    font-family:Arial,sans-serif;
		}

		body{
		    background:#f3f3f3;
		    font-size:14px;
		}

		.dashboard-wrapper{
		    display:flex;
		    min-height:100vh;
		}

		.sidebar{
		    width:250px;
		    background:#001A57;
		    color:white;
		    padding:25px 10px;
		    flex-shrink:0;
		}

		.sidebar-logo{
		    text-align:center;
		    margin-bottom:40px;
		}

		.sidebar-logo img{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.sidebar-menu{
		    display:flex;
		    flex-direction:column;
		    gap:12px;
		}

		.menu-item{
		    color:white;
		    text-decoration:none;
		    font-size:14px;
		    padding:10px 12px;
		    border-radius:10px;
		    display:flex;
		    align-items:center;
		    gap:8px;
		}

		.menu-item.active{
		    background:#2E63FF;
		}

		.menu-item:hover{
		    background:#2E63FF;
		}

		.main-section{
		    flex:1;
		    background:#f5f5f5;
		}

		.top-header{
		    height:90px;
		    background:#F0F2F5;
		    border-bottom:2px solid #cbd5e1;

		    display:flex;
		    justify-content:space-between;
		    align-items:center;

		    padding:0 40px;
		}

		.header-left{
		    display:flex;
		    align-items:center;
		    gap:15px;
		}

		.header-icon{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.header-left h1{
		    font-size:20px;
		    color:#0B2E7A;
		    font-weight:700;
		}

		.back-home-btn{
		    background:#2E63FF;
		    color:white;
		    text-decoration:none;

		    padding:14px 32px;

		    border-radius:10px;

		    font-size:14px;
		    font-weight:700;
		}

		.dashboard-content{
		    padding:30px 60px;
		}

		.welcome-section{
		    display:flex;
		    align-items:center;
		    gap:20px;
		    margin-bottom:30px;
		}

		.provider-logo{
		    width:50px;
		    height:50px;
		    object-fit:contain;
		}

		.welcome-section h2{
		    font-size:20px;
		    font-weight:700;
		    color:#111827;
		}

		.info-section{
		    max-width:750px;
		}

		.info-row{
		    display:flex;
		    margin-bottom:18px;
		}

		.label{
		    width:140px;
		    font-size:14px;
		    color:#222;
		}

		.value{
		    font-size:14px;
		    font-weight:600;
		    color:#111;
		}

		.divider{
		    margin:30px 0;
		    border:none;
		    border-top:1px solid #8f8f8f;
		    max-width:750px;
		}

    </style>
</head>
<body>
	<div class="dashboard-wrapper">

	    <!-- Sidebar -->

	    <div class="sidebar">

	        <div class="sidebar-logo">

	            <!-- Replace image later -->
				<img th:src="@{/images/wcg-logo.jpg}"
				     alt="WhiteCircle"
				     class="sidebar-logo">

	        </div>

	        <div class="sidebar-menu">

	            <a href="/employee/mediclaim/portal"
	               class="menu-item active">

	                <i class="fa-solid fa-table-columns"></i>

	                Dashboard

	            </a>

	            <a href="/employee/mediclaim/policy"
	               class="menu-item">

	                <i class="fa-solid fa-file-shield"></i>

	                Coverage

	            </a>

	            <a href="/employee/mediclaim/track/list"
	               class="menu-item">

	                <i class="fa-solid fa-file-medical"></i>

	                Claims

	            </a>

				<a href="/employee/mediclaim/helpdesk"
				   class="menu-item">

	                <i class="fa-solid fa-circle-question"></i>

	                Help center

	            </a>

	        </div>

	    </div>

	    <!-- Main -->

	    <div class="main-section">

	        <!-- Header -->

	        <div class="top-header">

	            <div class="header-left">

	                <!-- Replace image later -->
	                <img src=""
	                     alt="Mediclaim"
	                     class="header-icon">

	                <h1>

	                    My Mediclaims

	                </h1>

	            </div>

	            <a href="/employee/dashboard"
	               class="back-home-btn">

	                Back to Home

	            </a>

	        </div>

	        <!-- Content -->

	        <div class="dashboard-content">

	            <div class="welcome-section">

	                <!-- Replace image later -->
	                <img src=""
	                     alt="Provider Logo"
	                     class="provider-logo">

	                <div>

	                    <h2>

	                        Welcome to

	                        <span th:text="${policy != null ? policy.providerName : '-'}">

	                            Provider

	                        </span>

	                    </h2>

	                </div>

	            </div>

	            <!-- Employee Information -->

	            <div class="info-section">

	                <div class="info-row">

	                    <div class="label">

	                        Name:
	                    </div>

	                    <div class="value"
	                         th:text="${user.fullName}">

	                        Employee Name

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Email:
	                    </div>

	                    <div class="value"
	                         th:text="${profile != null ? profile.officialEmail : '-'}">

	                        Email

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Phone No.:
	                    </div>

	                    <div class="value"
	                         th:text="${profile != null ? profile.mobileNumber : '-'}">

	                        Mobile

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Company:
	                    </div>

	                    <div class="value"
	                         th:text="${profile != null ? profile.businessUnit : '-'}">

	                        Company

	                    </div>

	                </div>

	            </div>

	            <hr class="divider">

	            <!-- Policy Information -->

	            <div class="info-section">

	                <div class="info-row">

	                    <div class="label">

	                        Insurer:
	                    </div>

	                    <div class="value"
	                         th:text="${policy.providerName}">

	                        Insurer

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Policy Name:
	                    </div>

	                    <div class="value"
								th:text="${policy.policyName != null ?
						          policy.policyName : '-'}">

	                        Group Health Insurance

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Policy No.:
	                    </div>

	                    <div class="value"
	                         th:text="${policy != null ? policy.policyNumber : '-'}">

	                        Policy Number

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Policy Period:
	                    </div>

	                    <div class="value">

	                        <span th:text="${policy.validFrom}">

	                        </span>

	                        -

	                        <span th:text="${policy.validUntil}">

	                        </span>

	                    </div>

	                </div>

	                <div class="info-row">

	                    <div class="label">

	                        Insured:
	                    </div>

	                    <div class="value"
	                         th:text="${user.fullName}">

	                        Insured Person

	                    </div>

	                </div>

	            </div>

	        </div>

	    </div>

	</div>


</main> <script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('claimsPieChart').getContext('2d');

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Approved', 'Pending', 'Rejected'],
                datasets: [{
                    data: [3, 1, 1],
                    backgroundColor: ['#43A047', '#FB8C00', '#E53935'],
                    borderWidth: 0,
                    hoverOffset: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 15, font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' } } }
                },
                animation: { animateScale: true, animateRotate: true, duration: 1500, easing: 'easeOutBounce' }
            }
        });
    });
</script>
</body>
</html>
