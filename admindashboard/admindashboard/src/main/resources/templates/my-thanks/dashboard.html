<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{my-thanks/layout :: page(~{::div.dashboard-container}, 'dashboard', 'Dashboard')}">
<div class="dashboard-container">
    <style>
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .stat-title {
            font-size: 0.9rem;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .stat-value-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .icon-blue { background: #e0e7ff; color: #4338ca; }
        .icon-green { background: #dcfce7; color: #15803d; }
        .icon-yellow { background: #fef9c3; color: #ca8a04; }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .stat-unit {
            font-size: 1rem;
            color: #718096;
            font-weight: 600;
        }
        .stat-footer {
            font-size: 0.85rem;
            color: #2962ff;
            font-weight: 600;
        }

        /* --- TABLE STYLES --- */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 20px;
        }
        .table-responsive {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        .custom-table {
            width: 100%;
            margin-bottom: 0;
        }
        .custom-table th {
            background-color: #e2e8f0;
            color: #4a5568;
            font-weight: 600;
            padding: 15px 20px;
            font-size: 0.9rem;
            text-align: center;
            border: none;
        }
        .custom-table td {
            padding: 15px 20px;
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
            color: #2d3748;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }
        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }
        
        .pts-credit { color: #16a34a; font-weight: 700; }
        .pts-debit { color: #dc2626; font-weight: 700; }
        
        .status-badge {
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-completed {
            background-color: transparent;
            color: #16a34a;
            border: 1px solid #16a34a;
        }
    </style>
    <style>
        .dashboard-profile-header {
            margin-bottom: 30px;
        }
        .profile-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #84ff00;
            color: #0b132b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .btn-view-profile {
            border: 2px solid #2962ff;
            color: #2962ff;
            background: transparent;
            border-radius: 50px;
            padding: 5px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }
        .btn-view-profile:hover {
            background: #2962ff;
            color: #fff;
        }
    </style>

    <div class="dashboard-profile-header">
        <div class="d-flex align-items-center gap-4">
            <div class="profile-avatar-lg"
                 th:with="names=${user.fullName != null ? user.fullName.split(' ') : {'User'}}"
                 th:text="${names.length > 1 ? names[0].substring(0,1).toUpperCase() + names[names.length-1].substring(0,1).toUpperCase() : (names[0].length() > 0 ? names[0].substring(0,1).toUpperCase() : 'U')}">RS</div>
            <div>
                <h4 class="fw-bold mb-0" style="color: #1a202c;" th:text="${user.fullName != null ? user.fullName : 'Guest'}">Rohit Sharma</h4>
                <div class="text-muted mb-2" style="font-size: 0.9rem;" th:text="${user.employeeProfile != null && user.employeeProfile.id != null ? 'EMP' + user.employeeProfile.id : ''}">EMP114</div>
                <a href="/my-thanks/profile" class="btn-view-profile">View Profile</a>
            </div>
        </div>
    </div>

    <div class="stats-container">
        <!-- Card 1 -->
        <div class="stat-card">
            <div class="stat-title">Total Points Earned</div>
            <div class="stat-value-container">
                <div class="stat-icon icon-blue"><i class="fas fa-award"></i></div>
                <h2 class="stat-number"><span th:text="${wallet != null ? wallet.totalPointsEarned : 0}">0</span> <span class="stat-unit">PTS</span></h2>
            </div>
            <div class="stat-footer">Lifetime</div>
        </div>

        <!-- Card 2 -->
        <div class="stat-card">
            <div class="stat-title">Wallet Balance</div>
            <div class="stat-value-container">
                <div class="stat-icon icon-green"><i class="fas fa-wallet"></i></div>
                <h2 class="stat-number"><span th:text="${wallet != null ? wallet.walletBalance : 0}">0</span> <span class="stat-unit">PTS</span></h2>
            </div>
            <div class="stat-footer">Available To Redeem</div>
        </div>

        <!-- Card 3 -->
        <div class="stat-card">
            <div class="stat-title">Rewards Received</div>
            <div class="stat-value-container">
                <div class="stat-icon icon-yellow"><i class="fas fa-gift"></i></div>
                <h2 class="stat-number" th:text="${wallet != null ? wallet.rewardsReceived : 0}">0</h2>
            </div>
            <div class="stat-footer">Appreciations</div>
        </div>
    </div>

    <h3 class="section-title">Recent Rewards Received</h3>
    <div class="table-responsive">
        <table class="table custom-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Points</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}">
                    <td th:text="${tx.transactionDate}">-</td>
                    <td th:text="${tx.transactionType}">-</td>
                    <td th:classappend="${tx.transactionType == 'CREDIT' ? 'pts-credit' : 'pts-debit'}" th:text="${(tx.transactionType == 'CREDIT' ? '+' : '-') + tx.points}">0</td>
                    <td th:text="${tx.description}">-</td>
                    <td><span class="status-badge status-completed" th:text="${tx.status}">Completed</span></td>
                </tr>
                <tr th:if="${transactions == null || transactions.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No transactions yet</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>
</body>
</html>
