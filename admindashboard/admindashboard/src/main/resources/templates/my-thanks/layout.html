<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(content, activeMenu, pageTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Thanks - [[${pageTitle}]] | WhiteCircle Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fc;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Toggle Sidebar Transitions */
        .sidebar, .main-content {
            transition: all 0.3s ease;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            min-width: 250px;
            background-color: #0b132b; /* Deep navy blue from the mockup */
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 30px;
            min-height: 100vh;
            z-index: 1000;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-container img {
            width: 80px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .nav-item {
            padding: 0 20px;
            margin-bottom: 10px;
        }
        .nav-link {
            color: #a0aec0;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .nav-link i {
            margin-right: 15px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background-color: #1e40af; /* Brighter blue for active state */
        }
        .logout-container {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .logout-btn {
            color: #ef4444; /* Red color for logout */
            text-decoration: none;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .logout-btn i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }

        /* COLLAPSED STATE */
        body.sidebar-collapsed .sidebar {
            width: 80px;
            min-width: 80px;
        }
        body.sidebar-collapsed .sidebar .nav-link span,
        body.sidebar-collapsed .sidebar .logout-btn span {
            display: none;
        }
        body.sidebar-collapsed .sidebar .nav-link,
        body.sidebar-collapsed .sidebar .logout-btn {
            justify-content: center;
            padding: 12px 0;
        }
        body.sidebar-collapsed .sidebar .nav-link i,
        body.sidebar-collapsed .sidebar .logout-btn i {
            margin-right: 0;
            font-size: 1.3rem;
        }
        body.sidebar-collapsed .sidebar .logo-container img {
            width: 40px;
        }
        body.sidebar-collapsed .main-content {
            max-width: calc(100vw - 80px);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            max-width: calc(100vw - 250px);
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .page-title {
            color: #2962ff;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #84ff00; /* Bright green */
            color: #0b132b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            border: 2px solid #e2e8f0;
        }
        .user-info h6 {
            margin: 0;
            font-weight: 700;
            color: #1a202c;
            font-size: 1rem;
        }
        .user-info span {
            font-size: 0.8rem;
            color: #718096;
        }
        
        .action-btn {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 15px;
            color: #4a5568;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .action-btn:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
            color: #2962ff;
        }
        .pts-text {
            color: #38a169; /* Green text for points */
            font-weight: 700;
        }

        /* --- CONTENT AREA --- */
        .content-area {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        
        /* Modals global styles */
        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-container">
            <img src="/images/wcg-logo.jpg" alt="White Circle">
        </div>
        
        <div class="nav-item">
            <a href="/my-thanks/dashboard" class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                <i class="fas fa-home"></i> <span>Dashboard</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="/my-thanks/store" class="nav-link" th:classappend="${activeMenu == 'store' ? 'active' : ''}">
                <i class="fas fa-store"></i> <span>Redemption Store</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="/my-thanks/history" class="nav-link" th:classappend="${activeMenu == 'history' ? 'active' : ''}">
                <i class="fas fa-history"></i> <span>Transaction History</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="/my-thanks/send" class="nav-link" th:classappend="${activeMenu == 'send' ? 'active' : ''}">
                <i class="fas fa-hand-holding-heart"></i> <span>Send Thanks</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="/my-thanks/faqs" class="nav-link" th:classappend="${activeMenu == 'faqs' ? 'active' : ''}">
                <i class="fas fa-question-circle"></i> <span>FAQs</span>
            </a>
        </div>
        
        <div class="logout-container">
            <a href="/my-thanks/logout-thanks" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> <span>Log Out</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div th:if="${pageTitle != 'View Profile'}" class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-light border text-muted">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title" th:text="${pageTitle}">Dashboard</h1>
            </div>

            <div th:if="${pageTitle == 'View Profile'}" class="d-flex align-items-center gap-3">
                <a href="/my-thanks/dashboard" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; background-color: #2962ff; border: none;">
                    <i class="fas fa-arrow-left text-white"></i>
                </a>
                <div class="d-flex align-items-center fw-bold" style="font-size: 1.1rem; color: #2962ff;">
                    <a href="/my-thanks/dashboard" class="text-decoration-none" style="color: #2962ff;">Dashboard</a>
                    <i class="fas fa-chevron-right mx-3 text-muted" style="font-size: 0.8rem;"></i>
                    <span>View Profile</span>
                </div>
            </div>
            
            <div class="top-bar-right">
                <!-- Profile moved to individual pages -->
                <a href="#" class="action-btn px-3">
                    <i class="far fa-bell"></i>
                </a>
                
                <div class="action-btn px-3">
                    <i class="fas fa-wallet text-success"></i>
                    <span class="pts-text" th:text="${wallet != null ? wallet.walletBalance + ' PTS' : '0 PTS'}">0 PTS</span>
                </div>
                
                <a href="/my-thanks/cart" class="action-btn px-3 text-primary position-relative">
                    <i class="fas fa-shopping-cart"></i> Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadgeCount" th:text="${session.cart != null ? session.cart.size() : 0}" style="font-size: 0.65rem;">
                        0
                    </span>
                </a>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="content-area">
            <!-- Thymeleaf will inject the content here -->
            <div th:replace="${content}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar Toggle Logic
        const sidebarToggle = document.getElementById('sidebarToggle');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', function() {
                document.body.classList.toggle('sidebar-collapsed');
            });
        }
    </script>
</body>
</html>
