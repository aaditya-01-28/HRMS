<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{my-thanks/layout :: page(~{::div.history-container}, 'history', 'Transaction History')}">
<div class="history-container">
    <style>
        .page-header {
            margin-bottom: 25px;
        }
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }
        .filter-input-group {
            position: relative;
            flex: 1;
        }
        .filter-input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
        }
        .search-input-group {
            position: relative;
            flex: 2;
        }
        .search-input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.95rem;
            color: #4a5568;
        }
        .search-input-group .form-control {
            padding-left: 45px;
        }
        .btn-search {
            background-color: #2962ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 30px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-search:hover {
            background-color: #1e40af;
        }

        /* --- TABLE STYLES --- */
        .table-responsive {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .custom-table {
            width: 100%;
            margin-bottom: 0;
        }
        .custom-table th {
            background-color: #e2e8f0;
            color: #2962ff;
            font-weight: 700;
            padding: 15px 20px;
            font-size: 0.95rem;
            text-align: center;
            border: none;
        }
        .custom-table td {
            padding: 16px 20px;
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
            color: #1a202c;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
        }
        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }
        
        .pts-credit { color: #16a34a; font-weight: 700; }
        .pts-debit { color: #ef4444; font-weight: 700; }
        
        .status-badge {
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-completed {
            background-color: transparent;
            color: #22c55e;
            border: 1.5px solid #22c55e;
        }

        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
            }
            .filter-input-group, .search-input-group {
                flex: unset;
                width: 100%;
            }
            .btn-search {
                width: 100%;
            }
            .custom-table th, .custom-table td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }
        }
    </style>

    <div class="page-header">
        <h2 style="color: #2962ff; font-weight: 700; font-size: 1.3rem;">Transaction History</h2>
    </div>

    <!-- Filter Bar -->
    <form class="filter-bar" method="GET" th:action="@{/my-thanks/history}">
        <div class="filter-input-group">
            <input type="date" class="form-control" name="startDate" th:value="${startDate}" placeholder="From Date">
        </div>
        
        <div class="filter-input-group">
            <input type="date" class="form-control" name="endDate" th:value="${endDate}" placeholder="To Date">
        </div>
        
        <div class="search-input-group">
            <i class="fas fa-search"></i>
            <input type="text" class="form-control" name="searchQuery" th:value="${searchQuery}" placeholder="Search History...">
        </div>
        
        <button type="submit" class="btn btn-search">Search</button>
        <a th:href="@{/my-thanks/history}" class="btn btn-search" style="background-color: #64748b; margin-left: 10px; text-decoration: none;">Clear</a>
    </form>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table custom-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Points</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}" class="history-row">
                    <td class="tx-date" th:text="${tx.transactionDate}">-</td>
                    <td class="tx-type" th:text="${tx.transactionType}">-</td>
                    <td class="tx-points" th:classappend="${#strings.equalsIgnoreCase(tx.transactionType, 'CREDIT') ? 'pts-credit' : 'pts-debit'}" th:text="${(#strings.equalsIgnoreCase(tx.transactionType, 'CREDIT') ? '+' : '-') + tx.points}">0</td>
                    <td th:text="${tx.description}">-</td>
                    <td><span class="status-badge status-completed" th:text="${tx.status}">Completed</span></td>
                </tr>
                <tr th:if="${transactions == null || transactions.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No transactions yet</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>


</th:block>
</body>
</html>
