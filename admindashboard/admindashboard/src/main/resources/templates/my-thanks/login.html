<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Thanks - Login | WhiteCircle Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e4e4e4;
        }
        .login-wrapper {
            display: flex;
            min-height: 100vh;
        }
        .login-image-section {
            flex: 1.2;
            background: url('/images/wcg-building.png') center center/cover no-repeat;
            position: relative;
        }
        .login-form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 8%;
            background-color: #e4e4e4;
            position: relative;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            height: 80px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .welcome-text {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px;
            color: #000;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            font-size: 0.95rem;
        }
        .form-control {
            border: 1px solid #ccc;
            background-color: #d8d8d8;
            padding: 12px 15px;
            padding-left: 40px; /* Space for icon */
            border-radius: 8px;
            transition: all 0.3s;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #2962ff;
            box-shadow: 0 0 0 0.25rem rgba(41, 98, 255, 0.25);
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            z-index: 10;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        .btn-toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            z-index: 10;
        }
        .forgot-password {
            color: #ff3b30;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 30px;
        }
        .btn-login {
            background-color: #2962ff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 500;
            font-size: 1.1rem;
            width: 50%;
            margin: 0 auto;
            display: block;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #1c44b2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(41, 98, 255, 0.3);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 50px;
        }
        .social-icons a {
            color: #333;
            font-size: 1.8rem;
            transition: all 0.3s;
        }
        .social-icons a:hover {
            color: #2962ff;
            transform: scale(1.1);
        }
        /* Mobile responsive */
        @media (max-width: 991px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-image-section {
                flex: none;
                height: 30vh;
            }
            .login-form-section {
                padding: 40px 5%;
            }
        }
        
        .btn-back {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #333;
            font-size: 1.2rem;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-back:hover {
            color: #2962ff;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- Left side image -->
    <div class="login-image-section">
    </div>

    <!-- Right side form -->
    <div class="login-form-section">
        <a href="/employee/dashboard" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        
        <div class="logo-container">
            <img src="/images/wcg-logo.jpg" alt="White Circle Group">
        </div>

        <h1 class="welcome-text">Welcome Back!</h1>

        <form action="/perform_login" method="post" style="max-width: 400px; margin: 0 auto; width: 100%;">
            <input type="hidden" name="portalType" value="employee">
            <input type="hidden" name="redirectUrl" value="/my-thanks/dashboard">
            
            <div class="mb-3">
                <label class="form-label">Username or email address</label>
                <div class="input-group-custom">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" class="form-control" placeholder="eg. abc123@gmail.com" required>
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label">Password</label>
                <div class="input-group-custom">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" id="password" class="form-control" placeholder="enter your password" required>
                    <button type="button" class="btn-toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye-slash" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <a href="#" class="forgot-password">Forgot Password?</a>

            <button type="submit" class="btn btn-login">Login</button>

            <div class="social-icons">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="far fa-envelope"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
        </form>

    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        }
    }
</script>
</body>
</html>
