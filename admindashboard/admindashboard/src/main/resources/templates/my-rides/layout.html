<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activeTab, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">My Rides</title>
    <!-- Fonts and Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/base/reset.css}" rel="stylesheet">
    <link th:href="@{/css/pages/my-rides.css}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <nav class="mr-sidebar" id="mr-sidebar">
        <div class="brand">
            <img src="/images/wcg-logo.jpg" alt="White Circle" style="border: 2px solid white; border-radius: 12px; height: 80px; width: 80px; object-fit: cover;">
        </div>
        
        <div class="mr-nav">
            <a th:href="@{/my-rides/dashboard}" class="mr-nav-item" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                <i class="fa-solid fa-home"></i> <span>Home</span>
            </a>
            <a th:href="@{/my-rides/book-rides}" class="mr-nav-item" th:classappend="${activeTab == 'book-rides'} ? 'active' : ''">
                <i class="fa-solid fa-car"></i> <span>Book Rides</span>
            </a>
            <a th:href="@{/my-rides/cancel-ride}" class="mr-nav-item" th:classappend="${activeTab == 'cancel-ride'} ? 'active' : ''">
                <i class="fa-regular fa-circle-xmark"></i> <span>Cancel Ride</span>
            </a>
            <a th:href="@{/my-rides/helpdesk}" class="mr-nav-item" th:classappend="${activeTab == 'helpdesk'} ? 'active' : ''">
                <i class="fa-solid fa-headset"></i> <span>Helpdesk</span>
            </a>
        </div>

        <div class="mr-logout">
            <form th:action="@{/my-rides/logout}" method="post">
                <button type="submit" class="mr-nav-item" style="background:none; width:100%; text-align:left; border:none; cursor:pointer;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Log Out</span>
                </button>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="mr-main-content">
        <!-- Header -->
        <header class="mr-header">
            <div class="mr-header-left">
                <!-- Sidebar Toggle Button -->
                <button class="mr-sidebar-toggle" id="mr-sidebar-toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="mr-header-title">
                    <span th:if="${activeTab == 'dashboard'}" th:text="|Let's Start a Ride ${user?.fullName != null ? user?.fullName : 'Guest'}!|">Let's Start a Ride!</span>
                    <span th:if="${activeTab == 'book-rides' and title != 'Book Now'}">Book Rides</span>
                    <span th:if="${title == 'Book Now'}">
                        <a th:href="@{/my-rides/book-rides}" style="color:var(--mr-primary); margin-right:10px; text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a> 
                        Book Rides <i class="fa-solid fa-chevron-right" style="font-size:0.8rem; margin:0 10px;"></i> Book Now
                    </span>
                    <span th:if="${activeTab == 'cancel-ride'}">Cancel Ride</span>
                    <span th:if="${activeTab == 'helpdesk'}">Helpdesk</span>
                </div>
            </div>
            
            <div class="mr-header-right">
                <div class="mr-notification" style="position: relative; cursor: pointer;" id="notificationBell">
                    <i class="fa-regular fa-bell"></i>
                    <span id="notificationBadge" style="display: none; position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; font-size: 0.6rem; padding: 2px 5px; font-weight: bold;">0</span>
                    
                    <div id="notificationDropdown" style="display: none; position: absolute; top: 120%; right: -10px; width: 320px; background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--mr-border); z-index: 1000; overflow: hidden; cursor: default;">
                        <div style="padding: 1rem; border-bottom: 1px solid var(--mr-border); font-weight: bold; background: #f8fafc; color: var(--mr-text-main);">
                            Notifications
                        </div>
                        <div id="notificationList" style="max-height: 300px; overflow-y: auto; padding: 0.5rem 0;">
                            <!-- Dynamically populated notifications -->
                            <div style="padding: 1rem; text-align: center; color: var(--mr-text-muted); font-size: 0.9rem;">Loading notifications...</div>
                        </div>
                    </div>
                </div>
                <div class="mr-profile">
                    <img th:if="${user?.profileImage != null}" th:src="${user.profileImage}" alt="Profile" class="mr-profile-img">
                    <i th:unless="${user?.profileImage != null}" class="fa-solid fa-circle-user" style="font-size: 40px; color: #94a3b8;"></i>
                        <span class="mr-profile-name" th:text="${user?.fullName != null ? user?.fullName : 'Guest'}">Rohit Sharma</span>
                        <span class="mr-profile-role" th:text="${user?.role?.roleName != null ? user?.role?.roleName : 'Employee'}">Trainee-Tester</span>
                    </div>
                </div>
        </header>

        <!-- Dynamic Page Content injected here -->
        <div class="mr-container">
            <div th:replace="${content}"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/my-rides-api.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const bell = document.getElementById('notificationBell');
            const dropdown = document.getElementById('notificationDropdown');
            const list = document.getElementById('notificationList');
            const badge = document.getElementById('notificationBadge');
            
            bell.addEventListener('click', function(e) {
                if(e.target.closest('#notificationDropdown')) return;
                dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            });
            
            document.addEventListener('click', function(e) {
                if(!bell.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
            
            fetch('/api/my-rides/bookings')
                .then(res => res.json())
                .then(data => {
                    list.innerHTML = '';
                    if(Array.isArray(data) && data.length > 0) {
                        // Reverse to show most recent dates first
                        const sorted = [...data].reverse();
                        badge.style.display = 'block';
                        badge.textContent = sorted.length > 9 ? '9+' : sorted.length;
                        
                        sorted.forEach(b => {
                            const isCancelled = b.status === 'CANCELLED';
                            const icon = isCancelled ? '<i class="fa-solid fa-circle-xmark" style="color: #ef4444; font-size: 1.2rem;"></i>' 
                                                     : '<i class="fa-solid fa-circle-check" style="color: #22c55e; font-size: 1.2rem;"></i>';
                            const title = isCancelled ? 'Ride Cancelled' : 'Ride Booked';
                            const msg = isCancelled ? `Your ride for ${b.shortDate} was cancelled.` 
                                                    : `You have successfully booked a ride for ${b.shortDate}.`;
                            const timeColor = isCancelled ? '#ef4444' : '#22c55e';
                            
                            const item = document.createElement('div');
                            item.style.padding = '0.75rem 1rem';
                            item.style.borderBottom = '1px solid #f1f5f9';
                            item.style.display = 'flex';
                            item.style.gap = '1rem';
                            item.style.alignItems = 'flex-start';
                            item.innerHTML = `
                                <div style="margin-top: 2px;">${icon}</div>
                                <div>
                                    <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 2px; color: var(--mr-text-main);">${title}</div>
                                    <div style="font-size: 0.85rem; color: var(--mr-text-muted); line-height: 1.3;">${msg}</div>
                                    <div style="font-size: 0.75rem; font-weight: bold; color: ${timeColor}; margin-top: 4px;">${b.status}</div>
                                </div>
                            `;
                            list.appendChild(item);
                        });
                    } else {
                        list.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--mr-text-muted); font-size: 0.9rem;">No new notifications</div>';
                        badge.style.display = 'none';
                    }
                })
                .catch(err => {
                    list.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--mr-danger); font-size: 0.9rem;">Failed to load</div>';
                });
        });
    </script>
</body>
</html>
