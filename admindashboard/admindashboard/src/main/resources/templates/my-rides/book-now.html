<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{my-rides/layout :: layout('Book Now', 'book-rides', ~{::content})}">
<body>
    <div th:fragment="content">
        <div style="background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto;">
            
            <h2 style="font-weight: bold; margin-bottom: 2rem;"><i class="fa-regular fa-calendar"></i> Wednesday, 10 June 2026</h2>
            
            <form th:action="@{/my-rides/book-rides}" method="get">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Company</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-building" style="position: absolute; left: 15px; top: 12px; color: var(--mr-text-muted);"></i>
                        <input type="text" value="WhiteCircle Group" readonly style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 2.5rem; border: 1px solid var(--mr-border); border-radius: 8px; font-size: 1rem; background-color: #f8fafc; color: var(--mr-text-muted); box-sizing:border-box;">
                    </div>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Login Time</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-clock" style="position: absolute; left: 15px; top: 12px; color: var(--mr-text-muted);"></i>
                        <input type="text" value="10:00 AM" style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 2.5rem; border: 1px solid var(--mr-border); border-radius: 8px; font-size: 1rem; box-sizing:border-box;">
                    </div>
                </div>
                
                <div style="margin-bottom: 2.5rem;">
                    <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Logout Time</label>
                    <div style="position: relative;">
                        <i class="fa-regular fa-clock" style="position: absolute; left: 15px; top: 12px; color: var(--mr-text-muted);"></i>
                        <input type="text" value="07:00 PM" style="width: 100%; padding: 0.75rem 0.75rem 0.75rem 2.5rem; border: 1px solid var(--mr-border); border-radius: 8px; font-size: 1rem; box-sizing:border-box;">
                    </div>
                </div>
                
                <div style="text-align: center;">
                    <button type="submit" class="mr-btn mr-btn-primary" style="font-size: 1.25rem; padding: 0.75rem 3rem;">Book Ride</button>
                </div>
            </form>
            
        </div>
    </div>
</body>
</html>
