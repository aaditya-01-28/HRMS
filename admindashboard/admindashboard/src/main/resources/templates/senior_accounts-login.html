<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Senior Accounts Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            font-family:Arial,sans-serif;
            font-size:14px;
            background:#e5e7eb;
            margin:0;
            padding:0;
            height:100vh;
            overflow:hidden;
        }

        .split-screen-container{
            display:flex;
            width:100%;
            height:100vh;
        }

        .left-banner-side{
            flex:1;
            background:
                    linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.15)),
                    url('/images/Reception.png');
            background-size:cover;
            background-position:center;
            display:none;
        }

        @media(min-width:768px){
            .left-banner-side{
                display:block;
            }
        }

        .right-login-side{
            width:100%;
            background:#dcdcdc;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            position:relative;
            padding:40px;
        }

        @media(min-width:768px){
            .right-login-side{
                width:45%;
                flex-shrink:0;
            }
        }

        .btn-circular-back{
            position:absolute;
            top:30px;
            left:30px;
            width:42px;
            height:42px;
            background:#002D72;
            color:#fff !important;
            border-radius:4px; /* Sharp squared edges */
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            font-size:1.1rem;
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
            transition:all 0.3s ease;
        }

        .btn-circular-back:hover{
            transform:scale(1.05);
            background:#001d4a;
        }

        .welcome-headline{
            font-size:24px;
            font-weight:700;
            color:#1f2937;
            margin-top:15px;
            margin-bottom:25px;
            text-align:center;
        }

        .login-form-box{
            width:100%;
            max-width:360px;
        }

        .input-wrapper-group{
            position:relative;
            margin-bottom:20px;
        }

        .input-label-caption{
            display:block;
            font-size:13px;
            font-weight:600;
            color:#374151;
            margin-bottom:6px;
        }

        .sso-input-field{
            width:100%;
            height:48px;
            border-radius:4px; /* Sharp squared edges */
            border:1px solid #9ca3af;
            background:#ffffff;
            padding:0 20px 0 45px;
            font-size:14px;
            color:#1f2937;
            outline:none;
            transition:all 0.2s ease;
        }

        .sso-input-field:focus{
            border-color:#002D72;
            box-shadow:0 0 0 2px rgba(0,45,114,0.2);
        }

        .input-icon-decor{
            position:absolute;
            left:18px;
            top:40px;
            color:#6b7280;
            font-size:15px;
        }

        .link-forgot-password{
            display:block;
            text-align:right;
            font-size:13px;
            font-weight:600;
            color:#002D72;
            text-decoration:none;
            margin-top:-10px;
            margin-bottom:25px;
        }

        .link-forgot-password:hover{
            text-decoration:underline;
        }

        .btn-continue-sso{
            width:100%;
            height:48px;
            border-radius:4px; /* Sharp squared edges */
            background:#002D72;
            color:#ffffff;
            font-size:15px;
            font-weight:700;
            border:none;
            cursor:pointer;
            transition:all 0.2s ease;
            box-shadow:0 4px 12px rgba(0,45,114,0.2);
        }

        .btn-continue-sso:hover{
            background:#001d4a;
            transform:translateY(-1px);
        }

        .auth-error{
            background:#fee2e2;
            border:1px solid #fca5a5;
            color:#991b1b;
            padding:10px 15px;
            border-radius:4px; /* Sharp squared edges */
            font-size:13px;
            font-weight:600;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="split-screen-container">

    <div class="left-banner-side"></div>

    <div class="right-login-side">

        <a href="/senior_accounts/dashboard" class="btn-circular-back" title="Back to Dashboard">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="brand-logo-card">
            <img src="/images/wcg-logo.jpg" alt="White Circle" style="height: 85px; border-radius: 4px; object-fit: contain;">
        </div>

        <h2 class="welcome-headline">
            Accounts Admin - My Space Login
        </h2>

        <div class="login-form-box">

            <form th:action="@{/senior_accounts/login}" method="POST">

                <div class="input-wrapper-group">
                    <label class="input-label-caption">
                        Username or Employee ID
                    </label>
                    <i class="fa-solid fa-user input-icon-decor"></i>
                    <input type="text"
                           class="sso-input-field"
                           name="username"
                           placeholder="Enter Employee ID (e.g. EMP301)"
                           required>
                </div>

                <div class="input-wrapper-group">
                    <label class="input-label-caption">
                        Password
                    </label>
                    <i class="fa-solid fa-lock input-icon-decor"></i>
                    <input type="password"
                           class="sso-input-field"
                           name="password"
                           id="spacePassword"
                           placeholder="*****"
                           style="padding-right:40px;"
                           required>
                    <i class="fa-solid fa-eye"
                       style="position:absolute; right:14px; top:41px; cursor:pointer; color:#666666;"
                       onclick="togglePassword()">
                    </i>
                </div>

                <div th:if="${authError}" class="auth-error">
                    <span th:text="${authError}"></span>
                </div>

                <a href="/forgot-password" class="link-forgot-password">
                    Forgot Password?
                </a>

                <button type="submit" class="btn-continue-sso">
                    Continue to My Space
                </button>

            </form>

        </div>

    </div>

</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('spacePassword');
        const eyeIcon = event.target;
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>

</body>
</html>
