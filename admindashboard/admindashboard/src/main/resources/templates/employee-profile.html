<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - WhiteCircle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #0b1120;
            --sidebar-hover: #1e293b;
            --sidebar-active: #2563eb;
            --text-main: #0f172a;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            margin: 0; padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .profile-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR (TAB MENU) */
        .profile-sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: #fff;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            display: flex; flex-direction: column;
            padding-top: 30px;
            z-index: 1000;
        }

        .user-summary {
            text-align: center;
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .avatar-circle {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
            color: white; font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 3px solid #fff;
            margin: 0 auto 15px;
        }

        .user-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .user-desig { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0; }

        .nav-pills { padding: 0 15px; }
        .nav-pills .nav-link {
            color: #cbd5e1; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 8px;
            font-weight: 500; font-size: 0.95rem;
            display: flex; align-items: center; transition: all 0.2s;
            text-align: left;
        }
        .nav-pills .nav-link i { width: 24px; text-align: center; margin-right: 12px; font-size: 1.1rem; }
        .nav-pills .nav-link:hover { background-color: var(--sidebar-hover); color: #fff; }
        .nav-pills .nav-link.active { background-color: var(--sidebar-active); color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* MAIN CONTENT AREA */
        .profile-main {
            margin-left: 280px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            background: #fff; padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .top-nav-title { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        
        .progress-wrapper { display: flex; align-items: center; gap: 15px; }
        .progress-text { font-size: 0.85rem; font-weight: 600; color: #64748b; }
        .progress { width: 150px; height: 8px; border-radius: 10px; background-color: #e2e8f0; }
        .progress-bar { background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%); border-radius: 10px; }

        .content-area { padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; flex-grow: 1; }

        .tab-pane-card {
            background: #fff; border-radius: 16px; border: 1px solid var(--border-color);
            padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .tab-header {
            font-size: 1.3rem; font-weight: 700; color: #1e293b;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9;
        }

        /* FORM FIELDS */
        .info-box { margin-bottom: 24px; position: relative; }
        .info-label { font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        .info-value-text { font-size: 0.95rem; font-weight: 500; color: #0f172a; word-break: break-word; min-height: 24px; display: block; }
        
        .editable-field {
            width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 0.95rem; color: #0f172a; transition: all 0.2s; display: none; background: #fff;
        }
        .editable-field:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .editable-field:read-only { background-color: #f8fafc; color: #475569; border-color: #e2e8f0; cursor: not-allowed; }

        /* Edit Mode Toggle */
        body.editing .info-value-text { display: none !important; }
        body.editing .editable-field { display: block !important; }
        
        .empty-field { color: #94a3b8; font-style: italic; }

        /* FOOTER ACTIONS */
        .action-footer {
            margin-top: 40px; padding-top: 25px; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: flex-end; gap: 15px;
        }
        .btn-action { padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background-color: #2563eb; border: none; box-shadow: 0 4px 6px rgba(37,99,235,0.2); color: #fff; }
        .btn-primary:hover { background-color: #1d4ed8; transform: translateY(-1px); color: #fff; }
        .btn-outline { background: white; border: 1px solid #2563eb; color: #2563eb; text-decoration: none; display: flex; align-items: center; }
        .btn-outline:hover { background: #eff6ff; color: #2563eb; }

        @media (max-width: 991px) {
            .profile-sidebar { width: 80px; }
            .user-summary { padding: 20px 0; }
            .avatar-circle { width: 50px; height: 50px; font-size: 1.2rem; }
            .user-name, .user-desig { display: none; }
            .nav-pills .nav-link span { display: none; }
            .nav-pills .nav-link i { margin-right: 0; margin: 0 auto; font-size: 1.3rem; }
            .profile-main { margin-left: 80px; }
            .top-nav { padding: 15px 20px; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="profile-layout">
    <!-- LEFT SIDEBAR -->
    <div class="profile-sidebar">
        <div class="user-summary">
            <div class="avatar-circle" th:text="${user.fullName != null ? user.fullName.substring(0,1) : 'U'}">U</div>
            <div class="user-name" th:text="${user.fullName}">Employee Name</div>
            <div class="user-desig" th:text="${user.employeeProfile?.designation ?: 'Designation'}">Designation</div>
        </div>
        
        <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
            <button class="nav-link active" id="v-pills-personal-tab" data-bs-toggle="pill" data-bs-target="#v-pills-personal" type="button" role="tab"><i class="fas fa-user"></i> <span>Personal Details</span></button>
            <button class="nav-link" id="v-pills-edu-tab" data-bs-toggle="pill" data-bs-target="#v-pills-edu" type="button" role="tab"><i class="fas fa-graduation-cap"></i> <span>Educational Details</span></button>
            <button class="nav-link" id="v-pills-work-tab" data-bs-toggle="pill" data-bs-target="#v-pills-work" type="button" role="tab"><i class="fas fa-briefcase"></i> <span>Work Details</span></button>
            <button class="nav-link" id="v-pills-project-tab" data-bs-toggle="pill" data-bs-target="#v-pills-project" type="button" role="tab"><i class="fas fa-network-wired"></i> <span>Project & Allocation</span></button>
            <button class="nav-link" id="v-pills-reporting-tab" data-bs-toggle="pill" data-bs-target="#v-pills-reporting" type="button" role="tab"><i class="fas fa-sitemap"></i> <span>Reporting Lines</span></button>
            <button class="nav-link" id="v-pills-emergency-tab" data-bs-toggle="pill" data-bs-target="#v-pills-emergency" type="button" role="tab"><i class="fas fa-phone-alt"></i> <span>Emergency Contact</span></button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="profile-main">
        <div class="top-nav">
            <div class="top-nav-title text-primary">
                <i class="fas fa-user-circle"></i> My Profile
            </div>
            <div class="progress-wrapper">
                <span class="progress-text">Profile <span id="percentLabel" class="text-primary">0%</span> completed</span>
                <div class="progress">
                    <div class="progress-bar" id="completionBar" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show fw-bold shadow-sm mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="tab-pane-card">
                <form id="masterProfileForm" th:action="@{/employee/profile/save-detailed}" method="POST">
                    <!-- HIDDEN FIELD FOR REDIRECT -->
                    <input type="hidden" name="returnUrl" value="/employee/profile">
                    
                    <div class="tab-content" id="v-pills-tabContent">
                        
                        <!-- 1. PERSONAL DETAILS -->
                        <div class="tab-pane fade show active" id="v-pills-personal" role="tabpanel">
                            <h4 class="tab-header">Personal Details</h4>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Employee Name</label><span class="info-value-text" th:text="${user.fullName}"></span><input type="text" class="editable-field" th:value="${user.fullName}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Phone Number</label><span class="info-value-text" th:text="${user.employeeProfile?.mobileNumber}"></span><input type="text" name="mobileNumber" class="editable-field tracked-field" th:value="${user.employeeProfile?.mobileNumber}" pattern="\d{10}" title="10 digits"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Employee ID</label><span class="info-value-text" th:text="${user.username}"></span><input type="text" class="editable-field" th:value="${user.username}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Gender</label><span class="info-value-text" th:text="${user.employeeProfile?.gender}"></span><select name="gender" class="editable-field tracked-field"><option value="">Select</option><option value="Male" th:selected="${user.employeeProfile?.gender == 'Male'}">Male</option><option value="Female" th:selected="${user.employeeProfile?.gender == 'Female'}">Female</option></select></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Designation</label><span class="info-value-text" th:text="${user.employeeProfile?.designation}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.designation}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Date of Birth</label><span class="info-value-text" th:text="${user.employeeProfile?.dob}"></span><input type="date" name="dob" class="editable-field tracked-field" th:value="${user.employeeProfile?.dob}" max="9999-12-31"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Official Email</label><span class="info-value-text" th:text="${user.email}"></span><input type="email" class="editable-field" th:value="${user.email}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">PAN Card No.</label><span class="info-value-text text-uppercase" th:text="${user.employeeProfile?.panNo}"></span><input type="text" name="panNo" class="editable-field tracked-field text-uppercase" th:value="${user.employeeProfile?.panNo}" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Personal Email</label><span class="info-value-text" th:text="${user.employeeProfile?.personalEmail}"></span><input type="email" name="personalEmail" class="editable-field tracked-field" th:value="${user.employeeProfile?.personalEmail}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Aadhaar Card No.</label><span class="info-value-text" th:text="${user.employeeProfile?.aadharNo}"></span><input type="text" name="aadharNo" class="editable-field tracked-field" th:value="${user.employeeProfile?.aadharNo}" pattern="\d{12}"></div></div>
                                <div class="col-12"><div class="info-box"><label class="info-label">Permanent Address</label><span class="info-value-text" th:text="${user.employeeProfile?.permanentAddress}"></span><textarea name="permanentAddress" class="editable-field tracked-field" rows="2" th:text="${user.employeeProfile?.permanentAddress}"></textarea></div></div>
                            </div>
                        </div>

                        <!-- 2. EDUCATIONAL DETAILS -->
                        <div class="tab-pane fade" id="v-pills-edu" role="tabpanel">
                            <h4 class="tab-header">Educational Details</h4>
                            <h6 class="text-primary fw-bold mb-3">Highest Qualification</h6>
                            <div class="row mb-4 border-bottom pb-2">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Degree / Course</label><span class="info-value-text" th:text="${user.employeeProfile?.qual1Title}"></span><input type="text" name="qual1Title" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual1Title}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">University / Board</label><span class="info-value-text" th:text="${user.employeeProfile?.qual1Inst}"></span><input type="text" name="qual1Inst" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual1Inst}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Passing Year</label><span class="info-value-text" th:text="${user.employeeProfile?.qual1Year}"></span><input type="text" name="qual1Year" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual1Year}" pattern="^(19|20)\d{2}$"></div></div>
                            </div>
                            <h6 class="text-primary fw-bold mb-3">Secondary Qualification</h6>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Degree / Course</label><span class="info-value-text" th:text="${user.employeeProfile?.qual2Title}"></span><input type="text" name="qual2Title" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual2Title}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">University / Board</label><span class="info-value-text" th:text="${user.employeeProfile?.qual2Inst}"></span><input type="text" name="qual2Inst" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual2Inst}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Passing Year</label><span class="info-value-text" th:text="${user.employeeProfile?.qual2Year}"></span><input type="text" name="qual2Year" class="editable-field tracked-field" th:value="${user.employeeProfile?.qual2Year}" pattern="^(19|20)\d{2}$"></div></div>
                            </div>
                        </div>

                        <!-- 3. WORK DETAILS -->
                        <div class="tab-pane fade" id="v-pills-work" role="tabpanel">
                            <h4 class="tab-header">Work Details</h4>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Date of Joining</label><span class="info-value-text" th:text="${user.employeeProfile?.joiningDate}"></span><input type="date" name="joiningDate" class="editable-field tracked-field" th:value="${user.employeeProfile?.joiningDate}" max="9999-12-31"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Experience</label><span class="info-value-text" th:text="${user.employeeProfile?.experience}"></span><input type="text" name="experience" class="editable-field tracked-field" th:value="${user.employeeProfile?.experience}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">City</label><span class="info-value-text" th:text="${user.employeeProfile?.city}"></span><input type="text" name="city" class="editable-field tracked-field" th:value="${user.employeeProfile?.city}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Work Location / Address</label><span class="info-value-text" th:text="${user.employeeProfile?.workingAddress}"></span><textarea name="workingAddress" class="editable-field tracked-field" rows="2" th:text="${user.employeeProfile?.workingAddress}"></textarea></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">State / Country</label><span class="info-value-text" th:text="${user.employeeProfile?.country}"></span><input type="text" name="country" class="editable-field tracked-field" th:value="${user.employeeProfile?.country}"></div></div>
                            </div>
                        </div>

                        <!-- 4. PROJECT & ALLOCATION -->
                        <div class="tab-pane fade" id="v-pills-project" role="tabpanel">
                            <h4 class="tab-header">Project & Allocation</h4>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Business Unit</label><span class="info-value-text" th:text="${user.employeeProfile?.businessUnit}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.businessUnit}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Account Name</label><span class="info-value-text" th:text="${user.employeeProfile?.accountName}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.accountName}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Project Name</label><span class="info-value-text" th:text="${user.employeeProfile?.projectName}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.projectName}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Project Code</label><span class="info-value-text" th:text="${user.employeeProfile?.projectCode}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.projectCode}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Team / Group</label><span class="info-value-text" th:text="${user.employeeProfile?.teamGroup}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.teamGroup}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Vertical Name</label><span class="info-value-text" th:text="${user.employeeProfile?.verticalName}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.verticalName}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Customer Name</label><span class="info-value-text" th:text="${user.employeeProfile?.customerName}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.customerName}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Domain / Industry</label><span class="info-value-text" th:text="${user.employeeProfile?.domainIndustry}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.domainIndustry}" readonly></div></div>
                            </div>
                        </div>

                        <!-- 5. REPORTING LINES -->
                        <div class="tab-pane fade" id="v-pills-reporting" role="tabpanel">
                            <h4 class="tab-header">Reporting Lines</h4>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Reporting Manager</label><span class="info-value-text" th:text="${user.employeeProfile?.reportingManager}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.reportingManager}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Project Manager</label><span class="info-value-text" th:text="${user.employeeProfile?.projectManager}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.projectManager}" readonly></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">BU-HR Contact</label><span class="info-value-text" th:text="${user.employeeProfile?.buHrContact}"></span><input type="text" class="editable-field" th:value="${user.employeeProfile?.buHrContact}" readonly></div></div>
                            </div>
                        </div>

                        <!-- 6. EMERGENCY CONTACT -->
                        <div class="tab-pane fade" id="v-pills-emergency" role="tabpanel">
                            <h4 class="tab-header">Emergency Contact Details</h4>
                            <div class="row">
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Emergency Contact Person</label><span class="info-value-text" th:text="${user.employeeProfile?.emergencyContactName}"></span><input type="text" name="emergencyContactName" class="editable-field tracked-field" th:value="${user.employeeProfile?.emergencyContactName}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Relation with employee</label><span class="info-value-text" th:text="${user.employeeProfile?.relationWithEmployee}"></span><input type="text" name="relationWithEmployee" class="editable-field tracked-field" th:value="${user.employeeProfile?.relationWithEmployee}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Emergency Phone No.</label><span class="info-value-text" th:text="${user.employeeProfile?.emergencyPhone}"></span><input type="text" name="emergencyPhone" class="editable-field tracked-field" th:value="${user.employeeProfile?.emergencyPhone}" pattern="\d{10}"></div></div>
                                <div class="col-md-6"><div class="info-box"><label class="info-label">Alternate Mobile No.</label><span class="info-value-text" th:text="${user.employeeProfile?.altMobile}"></span><input type="text" name="altMobile" class="editable-field tracked-field" th:value="${user.employeeProfile?.altMobile}" pattern="\d{10}"></div></div>
                            </div>
                        </div>
                        
                    </div>

                    <div class="action-footer">
                        <button type="button" class="btn btn-action btn-primary" id="editToggleBtn" onclick="toggleEditMode()">Complete Profile</button>
                        <a th:href="@{/default-redirect}" class="btn btn-action btn-outline">Back to Home</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Initialization
    window.onload = function() {
        // Format empty info boxes
        document.querySelectorAll('.info-value-text').forEach(span => {
            if (!span.innerText || span.innerText.trim() === "") {
                span.innerText = "-";
                span.classList.add('empty-field');
            }
        });
        calculateCompletion();
    };

    function calculateCompletion() {
        const trackedFields = document.querySelectorAll('.tracked-field');
        if (trackedFields.length === 0) return;

        let filled = 0;
        trackedFields.forEach(f => {
            if(f.value && f.value.trim() !== "") filled++;
        });

        let percent = Math.round((filled / trackedFields.length) * 100);
        document.getElementById('completionBar').style.width = percent + '%';
        document.getElementById('percentLabel').innerText = percent + '%';
    }

    function toggleEditMode() {
        const body = document.body;
        const btn = document.getElementById('editToggleBtn');
        const form = document.getElementById('masterProfileForm');

        if (!body.classList.contains('editing')) {
            // ENTER EDIT MODE
            body.classList.add('editing');
            btn.innerHTML = '<i class="fas fa-save me-2"></i> Save Profile';
            btn.classList.replace('btn-primary', 'btn-success');
            btn.style.backgroundColor = '#16a34a';
            btn.style.color = '#fff';
            
            // Clean up placeholders
            document.querySelectorAll('.info-value-text.empty-field').forEach(span => {
                span.innerText = "";
            });
        } else {
            // SAVE LOGIC - Check validation across all tabs
            if (form.checkValidity()) {
                form.submit();
            } else {
                // Find first invalid element
                const invalidElement = form.querySelector(':invalid');
                if (invalidElement) {
                    // Find which tabpane it belongs to
                    const tabPane = invalidElement.closest('.tab-pane');
                    if (tabPane) {
                        // Activate that tab using Bootstrap Tab API
                        const tabId = tabPane.getAttribute('id');
                        const tabTrigger = document.querySelector(`[data-bs-target="#${tabId}"]`);
                        if(tabTrigger) {
                            const tab = new bootstrap.Tab(tabTrigger);
                            tab.show();
                        }
                    }
                    // Trigger browser's native validation UI
                    form.reportValidity();
                }
            }
        }
    }
</script>
</body>
</html>
