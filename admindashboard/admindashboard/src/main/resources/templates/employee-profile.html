<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - WhiteCircle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #0b1120;
            --sidebar-hover: #1e293b;
            --sidebar-active: #2563eb;
            --text-main: #0f172a;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
			font-family: Arial, sans-serif;
		    font-size: 14px;
            background: #efefef;
            margin: 0; padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
        }
		input,
		select,
		textarea,
		button,
		label,
		span,
		p,
		a,
		div {
		    font-family: Arial, sans-serif;
		    font-size: 14px;
		}

        .profile-layout {
            display: flex;
            min-height: 100vh;
        }

        
        /* MAIN CONTENT AREA */
        
		.profile-main {
		    margin-left: 0;
		    width: 100%;
		    flex-grow: 1;
		    display: flex;
		    flex-direction: column;
		}

		.top-nav{
		    display: flex;
		    justify-content: space-between;
		    align-items: center;
		    padding: 12px 20px;
		    background: #ffffff;
		    border-bottom: 1px solid #dce3ec;
		}

		.top-nav-title{
		    display: flex;
		    align-items: center;
		    gap: 10px;
		    font-family: Arial, sans-serif;
		    font-size: 18px;
		    font-weight: 700;
		    color: #233f67;
		}

		.top-nav-actions{
		    display: flex;
		    gap: 12px;
		}

		.top-nav-btn{
		    min-width: 120px;
		    padding: 8px 18px;
		    border-radius: 4px;
		    border: none;
		    text-decoration: none;
		    font-family: Arial, sans-serif;
		    font-size: 14px;
		    font-weight: 600;
		    text-align: center;
		    cursor: pointer;
		}

		.edit-btn{
		    background: #2F6FED;
		    color: #ffffff;
		}

		.edit-btn:hover{
		    background: #255ED1;
		}

		.home-btn{
		    background: #2F6FED;
		    color: #ffffff;
		}

		.home-btn:hover{
		    background: #255ED1;
		}
        .progress-wrapper { display: flex; align-items: center; gap: 15px; }
        .progress-text { font-size: 0.85rem; font-weight: 600; color: #64748b; }
        .progress { width: 150px; height: 8px; border-radius: 10px; background-color: #e2e8f0; }
        .progress-bar { background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%); border-radius: 10px; }

        .content-area { padding:15px 25px; max-width: 100%; margin: 0 auto; width: 100%; flex-grow: 1; }

        .tab-pane-card {
            background: #fff; border-radius: 16px; border: 1px solid var(--border-color);
            padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .tab-header {
            font-size: 1.3rem; font-weight: 700; color: #1e293b;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9;
        }
        
        .empty-field { color: #94a3b8; font-style: italic; }

        /* FOOTER ACTIONS */
        .action-footer {
            margin-top: 40px; padding-top: 25px; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: flex-end; gap: 15px;
        }
        

        @media (max-width: 991px) {
            .profile-sidebar { width: 80px; }
            .user-summary { padding: 20px 0; }
            .avatar-circle { width: 50px; height: 50px; font-size: 1.2rem; }
            .user-name, .user-desig { display: none; }
            .nav-pills .nav-link span { display: none; }
            .nav-pills .nav-link i { margin-right: 0; margin: 0 auto; font-size: 1.3rem; }
            .profile-main { margin-left: 0; }
            .top-nav { padding: 15px 20px; }
            .content-area { padding: 20px; }
        }
		.profile-tabs{
		    display:grid;
		    grid-template-columns:repeat(6,1fr);
		    width:100%;
		    background:#dfe8f2;
		    border-top:1px solid #cfd8e3;
		    border-bottom:1px solid #cfd8e3;
		}

		.tab-btn{
		    flex:1;
		    text-align:center;
		    border:none;
		    background:transparent;
		    padding:16px 10px;
			font-family: Arial, sans-serif;
			font-size:14px;
		    font-weight:700;
		    color:#233f67;
		    border-bottom:3px solid transparent;
		}

		.tab-btn.active{
		    color:#0066cc;
		    border-bottom:3px solid #0066cc;
		}

		.tab-pane-card{
		    border:none;
		    box-shadow:none;
		    background:#efefef;
		    padding:20px;
		}

		.tab-header{
		    display:none;
		}
		#v-pills-personal{
		    display:block;
		}

		#v-pills-edu,
		#v-pills-work,
		#v-pills-project,
		#v-pills-reporting,
		#v-pills-emergency{
		    display:none;
		}
		
		.general-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:28px 70px;
		    max-width:1250px;
		    margin:0 auto;
		    padding:20px 80px;
		}

		.field-group{
		    display:flex;
		    flex-direction:column;
		}

		.field-group label{
			font-family: Arial, sans-serif;
		    font-size:14px;
		    font-weight:700;
		    margin-bottom:10px;
		    color:#111;
		}

		.field-group input,
		.field-group select{
			font-family: Arial, sans-serif;
			font-size:14px;
		    height:38px;
		    border:1px solid #666;
		    border-radius:3px;
		    padding:0 10px;
		    background:#fff;
		}

		.field-group textarea{
			font-family: Arial, sans-serif;
			font-size:14px; 
		    height:120px;
		    border:1px solid #666;
		    border-radius:3px;
		    resize:none;
		    padding:10px;
		}

		.notes-group{
		    grid-row:span 2;
		}

		.tab-pane-card{
		    background:#efefef;
		    padding:0;
		}
		
		.classification-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:28px 70px;
		    max-width:1100px;
		    margin:0 auto;
		    padding:20px 50px;
		}
		
		.statutory-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:35px 70px;
		    max-width:1000px;
		    margin:0 auto;
		    padding:20px 50px;
		}
		.address-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr 1fr;
		    gap:30px 50px;
		    max-width:1300px;
		    margin:0 auto;
		    padding:20px 30px;
		}

		.address-section-title{
		    font-size:16px;
		    font-weight:700;
		    color:#0033cc;
		    margin-bottom:15px;
		}

		.address-column{
		    display:flex;
		    flex-direction:column;
		    gap:18px;
		}
		.hr-category-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:35px 70px;
		    max-width:900px;
		    margin:0 auto;
		    padding:25px 40px;
		}
		
		.documents-grid{
		    display:grid;
		    grid-template-columns:repeat(2, 1fr);
		    gap:60px 120px;
		    max-width:1200px;
		    margin:0 auto;
		    padding:40px 80px;
		}

		.document-card{
		    display:flex;
		    flex-direction:column;
		    align-items:center;
		}

		.document-card.center{
		    grid-column:1 / 3;
		    justify-self:center;
		}

		.document-title{
		    font-size:16px;
		    font-weight:700;
		    margin-bottom:15px;
		    text-align:center;
		}

		.upload-box{
			width:280px;
			height:170px;
		    border:1px dashed #666;
		    display:flex;
		    flex-direction:column;
		    justify-content:center;
		    align-items:center;
		    background:#fff;
		    cursor:pointer;
		}

		.upload-icon{
		    font-size:42px;
		    color:#777;
		    margin-bottom:8px;
		}

		.upload-text{
		    font-size:14px;
		    font-weight:600;
		    color:#111;
		}

		.upload-browse{
		    color:#0d6efd;
		    font-weight:600;
		    margin-top:4px;
		}

		.upload-box input{
		    display:none;
		}
		
		.file-name{
		    margin-top:8px;
		    font-family:Arial,sans-serif;
		    font-size:12px;
		    color:#233f67;
		    text-align:center;
		    word-break:break-word;
		}
		.file-preview{
		    margin-top:10px;
		    display:flex;
		    justify-content:center;
		    align-items:center;
		    gap:8px;
		    font-size:12px;
		    color:#233f67;
		    word-break:break-word;
		}

		.remove-file{
		    color:#dc3545;
		    font-size:16px;
		    font-weight:bold;
		    cursor:pointer;
		}

		.remove-file:hover{
		    color:#b02a37;
		}
    </style>
</head>
<body>

<div class="profile-layout">
    <!-- LEFT SIDEBAR -->
    

    <!-- MAIN CONTENT -->
    <div class="profile-main">
		<div class="top-nav">

		    <div class="top-nav-title">
		        <i class="fas fa-user-circle text-primary"></i>
		        My Profile
		    </div>

		    <div class="top-nav-actions">

				<button type="button"
				        class="top-nav-btn edit-btn"
				        id="editProfileBtn">
				    Edit Details
				</button>

				<button type="submit"
				        form="masterProfileForm"
				        class="top-nav-btn edit-btn"
				        id="saveProfileBtn"
				        style="display:none;">
				    Save Changes
				</button>

				<button type="button"
				        class="top-nav-btn home-btn"
				        id="cancelEditBtn"
				        style="display:none;">
				    Cancel
				</button>

				<a href="javascript:history.back()"
				   class="top-nav-btn home-btn"
				   id="backHomeBtn">
				    Back to Home
				</a>

		    </div>

		</div>

		<div class="profile-tabs">

		    <button class="tab-btn active"
		            onclick="showProfileTab('v-pills-personal',this)">
		        General
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-edu',this)">
		        Classification
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-work',this)">
		        Statutory
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-project',this)">
		        Address
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-reporting',this)">
		        HR Category
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-emergency',this)">
		        Documents
		    </button>

		</div>
		
       

        <div class="content-area">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show fw-bold shadow-sm mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="tab-pane-card">
				<form id="masterProfileForm"
				      th:action="@{/employee/profile/save-detailed}"
				      method="POST"
				      enctype="multipart/form-data">
                    <!-- HIDDEN FIELD FOR REDIRECT -->
                    <input type="hidden" name="returnUrl" value="/employee/profile">
                    
                    <div class="tab-content" id="v-pills-tabContent">
                        
						<!-- GENERAL TAB -->
						<div id="v-pills-personal">

						    <div class="general-grid">

						        <div class="field-group">
						            <label>Employee ID *</label>
						            <input type="text"
						                   name="employeeId"
						                   th:value="${user.username}" class="employee-readonly">
						        </div>

						        <div class="field-group">
						            <label>Spouse Name</label>
									<input type="text"
									       name="spouseName"
									       th:value="${employeeProfile.spouseName}">
						        </div>

						        <div class="field-group">
						            <label>Full Name *</label>
						            <input type="text"
						                   name="fullName"
						                   th:value="${user.fullName}" class="employee-readonly">
						        </div>

						        <div class="field-group">
						            <label>Date of Joining</label>
						            <input type="date"
						                   name="joiningDate"
						                   th:value="${user.employeeProfile?.joiningDate}" class="employee-readonly">
						        </div>

						        <div class="field-group">
						            <label>Gender *</label>
						            <select name="gender">
										<option value="">Select Gender</option>
										<option value="Male"
										        th:selected="${employeeProfile.gender == 'Male'}">Male</option>
										<option value="Female"
										        th:selected="${employeeProfile.gender == 'Female'}">Female</option>
										<option value="Other"
										        th:selected="${employeeProfile.gender == 'Other'}">Other</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Father's Name</label>
						            <input type="text"
						                   name="fatherName"
										   th:value="${employeeProfile.fatherName}">
						        </div>

						        <div class="field-group">
						            <label>Probation Period (in days)</label>
									<input type="number"
									       name="probationPeriod"
									       th:value="${employeeProfile.probationPeriod}">
						        </div>

						        <div class="field-group">
						            <label>Mother's Name</label>
						            <input type="text"
						                   name="motherName"
										   th:value="${employeeProfile.motherName}">
						        </div>

						        <div class="field-group">
						            <label>Marital Status *</label>
						            <select name="maritalStatus">
										<option value="">Select Marital Status</option>
										<option value="Single"
										        th:selected="${employeeProfile.maritalStatus == 'Single'}">Single</option>
										<option value="Married"
										        th:selected="${employeeProfile.maritalStatus == 'Married'}">Married</option>
										<option value="Divorced"
										        th:selected="${employeeProfile.maritalStatus == 'Divorced'}">Divorced</option>
										<option value="Widowed"
										        th:selected="${employeeProfile.maritalStatus == 'Widowed'}">Widowed</option>
						            </select>
						        </div>

						    </div>

						</div>

						<!-- CLASSIFICATION TAB -->
						<div id="v-pills-edu" style="display:none;">

						    <div class="classification-grid">

						        <div class="field-group">
						            <label>Branch</label>
						            <input type="text" name="branch"
									th:value="${employeeProfile.branch}" class="employee-readonly">
						        </div>

						        <div class="field-group">
									<label>Designation</label>
									<select name="designation" class="employee-readonly">
									    <option value="">Select Designation</option>

										<option value="Software Engineer" th:selected="${employeeProfile.designation == 'Software Engineer'}">Software Engineer</option>
										<option value="Senior Software Engineer" th:selected="${employeeProfile.designation == 'Senior Software Engineer'}">Senior Software Engineer</option>
										<option value="Tech Lead" th:selected="${employeeProfile.designation == 'Tech Lead'}">Tech Lead</option>
										<option value="Engineering Manager" th:selected="${employeeProfile.designation == 'Engineering Manager'}">Engineering Manager</option>
										<option value="HR Executive" th:selected="${employeeProfile.designation == 'HR Executive'}">HR Executive</option>
										<option value="HR Manager" th:selected="${employeeProfile.designation == 'HR Manager'}">HR Manager</option>
										<option value="Recruiter" th:selected="${employeeProfile.designation == 'Recruiter'}">Recruiter</option>
										<option value="Accountant" th:selected="${employeeProfile.designation == 'Accountant'}">Accountant</option>
										<option value="Finance Manager" th:selected="${employeeProfile.designation == 'Finance Manager'}">Finance Manager</option>
										<option value="Sales Executive" th:selected="${employeeProfile.designation == 'Sales Executive'}">Sales Executive</option>
										<option value="Sales Manager" th:selected="${employeeProfile.designation == 'Sales Manager'}">Sales Manager</option>
										<option value="Marketing Executive" th:selected="${employeeProfile.designation == 'Marketing Executive'}">Marketing Executive</option>
										<option value="Marketing Manager" th:selected="${employeeProfile.designation == 'Marketing Manager'}">Marketing Manager</option>
										<option value="Product Manager" th:selected="${employeeProfile.designation == 'Product Manager'}">Product Manager</option>
										<option value="UI/UX Designer" th:selected="${employeeProfile.designation == 'UI/UX Designer'}">UI/UX Designer</option>
										<option value="QA Engineer" th:selected="${employeeProfile.designation == 'QA Engineer'}">QA Engineer</option>
										<option value="DevOps Engineer" th:selected="${employeeProfile.designation == 'DevOps Engineer'}">DevOps Engineer</option>
										<option value="System Administrator" th:selected="${employeeProfile.designation == 'System Administrator'}">System Administrator</option>
										<option value="Intern" th:selected="${employeeProfile.designation == 'Intern'}">Intern</option>
										<option value="Trainee" th:selected="${employeeProfile.designation == 'Trainee'}">Trainee</option>

									</select>
						        </div>

						        <div class="field-group">
						            <label>Salary Structure</label>
									<select name="salaryStructure" class="employee-readonly">
										<option value="">Select Salary Structure</option>
										<option value="Basic" th:selected="${employeeProfile.salaryStructure == 'Basic'}">Basic</option>
										<option value="HRA" th:selected="${employeeProfile.salaryStructure == 'HRA'}">HRA</option>
										<option value="Special Allowance" th:selected="${employeeProfile.salaryStructure == 'Special Allowance'}">Special Allowance</option>
										<option value="PF" th:selected="${employeeProfile.salaryStructure == 'PF'}">PF</option>
										<option value="Professional Tax" th:selected="${employeeProfile.salaryStructure == 'Professional Tax'}">Professional Tax</option>

									</select>
						        </div>

						        <div class="field-group">
									<label>Bank Name</label>
									<input type="text"
									       name="bankName"
									       th:value="${employeeProfile.bankName}"
									       placeholder="Enter Bank Name">
						        </div>

						        <div class="field-group">
						            <label>Leave Policy</label>
									<select name="leavePolicy" class="employee-readonly">
										<option value="">Select Leave Policy</option>
										<option value="Casual Leave" th:selected="${employeeProfile.leavePolicy == 'Casual Leave'}">Casual Leave</option>
										<option value="Sick Leave" th:selected="${employeeProfile.leavePolicy == 'Sick Leave'}">Sick Leave</option>
										<option value="Earned Leave" th:selected="${employeeProfile.leavePolicy == 'Earned Leave'}">Earned Leave</option>
										<option value="Comp Off" th:selected="${employeeProfile.leavePolicy == 'Comp Off'}">Comp Off</option>
										<option value="Maternity Leave" th:selected="${employeeProfile.leavePolicy == 'Maternity Leave'}">Maternity Leave</option>
										<option value="Paternity Leave" th:selected="${employeeProfile.leavePolicy == 'Paternity Leave'}">Paternity Leave</option>
										<option value="Marriage Leave" th:selected="${employeeProfile.leavePolicy == 'Marriage Leave'}">Marriage Leave</option>
										<option value="Bereavement Leave" th:selected="${employeeProfile.leavePolicy == 'Bereavement Leave'}">Bereavement Leave</option>
										<option value="Loss of Pay" th:selected="${employeeProfile.leavePolicy == 'Loss of Pay'}">Loss of Pay</option>
									</select>
						        </div>

						        <div class="field-group">
						            <label>A/C No.</label>
									<input type="text"
									       name="bankAccountNumber"
									       th:value="${employeeProfile.bankAccountNumber}"
									       placeholder="Enter Account Number">
						        </div>

						        <div class="field-group">
						            <label>Attendance Structure</label>
									<select name="attendanceStructure" class="employee-readonly">
										<option value="">Select Attendance Structure</option>
										<option value="Casual Leave" th:selected="${employeeProfile.attendanceStructure == 'Casual Leave'}">Casual Leave</option>
										<option value="Hourly" th:selected="${employeeProfile.attendanceStructure == 'Hourly'}">Hourly</option>
										<option value="Sick Leave" th:selected="${employeeProfile.attendanceStructure == 'Sick Leave'}">Sick Leave</option>
										<option value="Test" th:selected="${employeeProfile.attendanceStructure == 'Test'}">Test</option>

									</select>
						        </div>

						        <div class="field-group">
						            <label>IFSC Code</label>
									<input type="text"
									       name="bankIfscCode"
									       th:value="${employeeProfile.bankIfscCode}"
									       placeholder="Enter IFSC Code"
										   maxlength="11"
								         pattern="^[A-Z]{4}0[A-Z0-9]{6}$"
								         title="Example: SBIN0001234"
								         style="text-transform: uppercase;">
						        </div>

						        <div class="field-group">
						            <label>Timesheet Policy</label>
									<select name="timesheetPolicy" class="employee-readonly">
										<option value="">Select Timesheet Policy</option>
										<option value="Daily" th:selected="${employeeProfile.timesheetPolicy == 'Daily'}">Daily</option>
										<option value="Weekly" th:selected="${employeeProfile.timesheetPolicy == 'Weekly'}">Weekly</option>
										<option value="Monthly" th:selected="${employeeProfile.timesheetPolicy == 'Monthly'}">Monthly</option>

									</select>
						        </div>

						        <div class="field-group">
									<label>Department</label>
									<select name="department"
									        th:value="${employeeProfile.department}" class="employee-readonly">
											<option value="">Select Department</option>

											    <option value="Engineering"
											            th:selected="${employeeProfile.department == 'Engineering'}">
											        Engineering
											    </option>

											    <option value="Human Resources"
											            th:selected="${employeeProfile.department == 'Human Resources'}">
											        Human Resources
											    </option>

											    <option value="Finance"
											            th:selected="${employeeProfile.department == 'Finance'}">
											        Finance
											    </option>

											    <option value="Sales"
											            th:selected="${employeeProfile.department == 'Sales'}">
											        Sales
											    </option>

											    <option value="Marketing"
											            th:selected="${employeeProfile.department == 'Marketing'}">
											        Marketing
											    </option>

											    <option value="Product"
											            th:selected="${employeeProfile.department == 'Product'}">
											        Product
											    </option>

											    <option value="Design"
											            th:selected="${employeeProfile.department == 'Design'}">
											        Design
											    </option>

											    <option value="Quality Assurance"
											            th:selected="${employeeProfile.department == 'Quality Assurance'}">
											        Quality Assurance
											    </option>

											    <option value="DevOps"
											            th:selected="${employeeProfile.department == 'DevOps'}">
											        DevOps
											    </option>

											    <option value="IT Support"
											            th:selected="${employeeProfile.department == 'IT Support'}">
											        IT Support

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // Initialization
    window.onload = function() {
        // Format empty info boxes
        document.querySelectorAll('.info-value-text').forEach(span => {
            if (!span.innerText || span.innerText.trim() === "") {
                span.innerText = "-";
                span.classList.add('empty-field');
            }
        });
        calculateCompletion();
    };

    function calculateCompletion() {
        const trackedFields = document.querySelectorAll('.tracked-field');
        if (trackedFields.length === 0) return;

        let filled = 0;
        trackedFields.forEach(f => {
            if(f.value && f.value.trim() !== "") filled++;
        });

        let percent = Math.round((filled / trackedFields.length) * 100);
        document.getElementById('completionBar').style.width = percent + '%';
        document.getElementById('percentLabel').innerText = percent + '%';
    }

    function toggleEditMode() {
        const body = document.body;
        const btn = document.getElementById('editToggleBtn');
        const form = document.getElementById('masterProfileForm');

        if (!body.classList.contains('editing')) {
            // ENTER EDIT MODE
            body.classList.add('editing');
            btn.innerHTML = '<i class="fas fa-save me-2"></i> Save Profile';
            btn.classList.replace('btn-primary', 'btn-success');
            btn.style.backgroundColor = '#16a34a';
            btn.style.color = '#fff';
            
            // Clean up placeholders
            document.querySelectorAll('.info-value-text.empty-field').forEach(span => {
                span.innerText = "";
            });
        } else {
            // SAVE LOGIC - Check validation across all tabs
            if (form.checkValidity()) {
                form.submit();
            } else {
                // Find first invalid element
                const invalidElement = form.querySelector(':invalid');
                if (invalidElement) {
                    // Find which tabpane it belongs to
                    const tabPane = invalidElement.closest('.tab-pane');
                    if (tabPane) {
                        // Activate that tab using Bootstrap Tab API
                        const tabId = tabPane.getAttribute('id');
                        const tabTrigger = document.querySelector(`[data-bs-target="#${tabId}"]`);
                        if(tabTrigger) {
                            const tab = new bootstrap.Tab(tabTrigger);
                            tab.show();
                        }
                    }
                    // Trigger browser's native validation UI
                    form.reportValidity();
                }
            }
        }
    }
	function showProfileTab(tabId, btn) {

	    const tabs = [
	        'v-pills-personal',
	        'v-pills-edu',
	        'v-pills-work',
	        'v-pills-project',
	        'v-pills-reporting',
	        'v-pills-emergency'
	    ];

	    tabs.forEach(id => {
	        document.getElementById(id).style.display = 'none';
	    });

	    document.getElementById(tabId).style.display = 'block';

	    document.querySelectorAll('.tab-btn').forEach(t => {
	        t.classList.remove('active');
	    });

	    btn.classList.add('active');
	}
	
	function setupFileUpload(inputId, nameId, previewId) {
	    const input = document.getElementById(inputId);

	    input.addEventListener("change", function () {
	        if (this.files.length > 0) {
	            document.getElementById(nameId).textContent =
	                this.files[0].name;

	            document.getElementById(previewId).style.display = "flex";
	        }
	    });
	}

	function removeFile(event, inputId, nameId, previewId) {

	    event.preventDefault();
	    event.stopPropagation();

	    document.getElementById(inputId).value = "";

	    document.getElementById(nameId).textContent = "";

	    document.getElementById(previewId).style.display = "none";
	}

	setupFileUpload(
	    "presentAddressImage",
	    "presentAddressImageName",
	    "presentAddressImagePreview"
	);

	setupFileUpload(
	    "aadharProof",
	    "aadharProofName",
	    "aadharProofPreview"
	);

	setupFileUpload(
	    "panProof",
	    "panProofName",
	    "panProofPreview"
	);
	document.addEventListener("DOMContentLoaded", function () {

	    disableProfileFields();

	});

	function disableProfileFields() {

	    document.querySelectorAll(
	        '#masterProfileForm input,' +
	        '#masterProfileForm textarea'
	    ).forEach(field => {

	        if (field.type === "hidden" || field.type === "file") return;

	        field.readOnly = true;
	    });

	    document.querySelectorAll(
	        '#masterProfileForm select'
	    ).forEach(field => {

	        field.disabled = true;
	    });

	    document.querySelectorAll(
	        '#masterProfileForm input[type="file"]'
	    ).forEach(field => {

	        field.disabled = true;
	    });
	}
	document.getElementById("editProfileBtn")
	    .addEventListener("click", function () {

	    // Enable inputs and textareas
		document.querySelectorAll(
		    '#masterProfileForm input,' +
		    '#masterProfileForm textarea'
		).forEach(field => {

		    if (
		        field.type !== "hidden" &&
		        field.type !== "file" &&
		        !field.classList.contains("employee-readonly")
		    ) {
		        field.readOnly = false;
		    }
		});

	    // Enable selects
		document.querySelectorAll(
		    '#masterProfileForm select'
		).forEach(field => {

		    if (!field.classList.contains("employee-readonly")) {
		        field.disabled = false;
		    }
		});

	    // Enable file uploads
	    document.querySelectorAll(
	        '#masterProfileForm input[type="file"]'
	    ).forEach(field => {

	        field.disabled = false;
	    });

	    // Change buttons
	    document.getElementById("editProfileBtn").style.display = "none";
	    document.getElementById("backHomeBtn").style.display = "none";
		document.getElementById("saveProfileBtn").style.display = "inline-block";
	    document.getElementById("cancelEditBtn").style.display = "inline-block";
	});
	document.getElementById("saveProfileBtn")
	    .addEventListener("click", function (e) {

	        const form = document.getElementById("masterProfileForm");

	        if (!form.checkValidity()) {
	            form.reportValidity();
	            return;
	        }

	        form.submit();
	});	
	document.getElementById("cancelEditBtn")
