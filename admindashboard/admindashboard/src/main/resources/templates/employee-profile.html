<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - WhiteCircle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #0b1120;
            --sidebar-hover: #1e293b;
            --sidebar-active: #2563eb;
            --text-main: #0f172a;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
             background: #efefef;
            margin: 0; padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .profile-layout {
            display: flex;
            min-height: 100vh;
        }

        
        /* MAIN CONTENT AREA */
        
		.profile-main {
		    margin-left: 0;
		    width: 100%;
		    flex-grow: 1;
		    display: flex;
		    flex-direction: column;
		}

        .top-nav {
            background: #fff; padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .top-nav-title { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        
        .progress-wrapper { display: flex; align-items: center; gap: 15px; }
        .progress-text { font-size: 0.85rem; font-weight: 600; color: #64748b; }
        .progress { width: 150px; height: 8px; border-radius: 10px; background-color: #e2e8f0; }
        .progress-bar { background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%); border-radius: 10px; }

        .content-area { padding:15px 25px; max-width: 100%; margin: 0 auto; width: 100%; flex-grow: 1; }

        .tab-pane-card {
            background: #fff; border-radius: 16px; border: 1px solid var(--border-color);
            padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .tab-header {
            font-size: 1.3rem; font-weight: 700; color: #1e293b;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9;
        }
        
        .empty-field { color: #94a3b8; font-style: italic; }

        /* FOOTER ACTIONS */
        .action-footer {
            margin-top: 40px; padding-top: 25px; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: flex-end; gap: 15px;
        }
        .btn-action { padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background-color: #2563eb; border: none; box-shadow: 0 4px 6px rgba(37,99,235,0.2); color: #fff; }
        .btn-primary:hover { background-color: #1d4ed8; transform: translateY(-1px); color: #fff; }
        .btn-outline { background: white; border: 1px solid #2563eb; color: #2563eb; text-decoration: none; display: flex; align-items: center; }
        .btn-outline:hover { background: #eff6ff; color: #2563eb; }

        @media (max-width: 991px) {
            .profile-sidebar { width: 80px; }
            .user-summary { padding: 20px 0; }
            .avatar-circle { width: 50px; height: 50px; font-size: 1.2rem; }
            .user-name, .user-desig { display: none; }
            .nav-pills .nav-link span { display: none; }
            .nav-pills .nav-link i { margin-right: 0; margin: 0 auto; font-size: 1.3rem; }
            .profile-main { margin-left: 0; }
            .top-nav { padding: 15px 20px; }
            .content-area { padding: 20px; }
        }
		.profile-tabs{
		    display:grid;
		    grid-template-columns:repeat(6,1fr);
		    width:100%;
		    background:#dfe8f2;
		    border-top:1px solid #cfd8e3;
		    border-bottom:1px solid #cfd8e3;
		}

		.tab-btn{
		    flex:1;
		    text-align:center;
		    border:none;
		    background:transparent;
		    padding:16px 10px;
		    font-weight:700;
		    color:#233f67;
		    border-bottom:3px solid transparent;
		}

		.tab-btn.active{
		    color:#0066cc;
		    border-bottom:3px solid #0066cc;
		}

		.tab-pane-card{
		    border:none;
		    box-shadow:none;
		    background:#efefef;
		    padding:20px;
		}

		.tab-header{
		    display:none;
		}
		#v-pills-personal{
		    display:block;
		}

		#v-pills-edu,
		#v-pills-work,
		#v-pills-project,
		#v-pills-reporting,
		#v-pills-emergency{
		    display:none;
		}
		
		.general-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:28px 70px;
		    max-width:1250px;
		    margin:0 auto;
		    padding:20px 80px;
		}

		.field-group{
		    display:flex;
		    flex-direction:column;
		}

		.field-group label{
		    font-size:14px;
		    font-weight:700;
		    margin-bottom:10px;
		    color:#111;
		}

		.field-group input,
		.field-group select{
		    height:38px;
		    border:1px solid #666;
		    border-radius:3px;
		    padding:0 10px;
		    background:#fff;
		}

		.field-group textarea{
		    height:120px;
		    border:1px solid #666;
		    border-radius:3px;
		    resize:none;
		    padding:10px;
		}

		.notes-group{
		    grid-row:span 2;
		}

		.tab-pane-card{
		    background:#efefef;
		    padding:0;
		}
		
		.classification-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:28px 70px;
		    max-width:1100px;
		    margin:0 auto;
		    padding:20px 50px;
		}
		
		.statutory-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:35px 70px;
		    max-width:1000px;
		    margin:0 auto;
		    padding:20px 50px;
		}
		.address-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr 1fr;
		    gap:30px 50px;
		    max-width:1300px;
		    margin:0 auto;
		    padding:20px 30px;
		}

		.address-section-title{
		    font-size:16px;
		    font-weight:700;
		    color:#0033cc;
		    margin-bottom:15px;
		}

		.address-column{
		    display:flex;
		    flex-direction:column;
		    gap:18px;
		}
		.hr-category-grid{
		    display:grid;
		    grid-template-columns:1fr 1fr;
		    gap:35px 70px;
		    max-width:900px;
		    margin:0 auto;
		    padding:25px 40px;
		}
		
		.documents-grid{
		    display:grid;
		    grid-template-columns:repeat(2, 1fr);
		    gap:60px 120px;
		    max-width:1200px;
		    margin:0 auto;
		    padding:40px 80px;
		}

		.document-card{
		    display:flex;
		    flex-direction:column;
		    align-items:center;
		}

		.document-card.center{
		    grid-column:1 / 3;
		    justify-self:center;
		}

		.document-title{
		    font-size:16px;
		    font-weight:700;
		    margin-bottom:15px;
		    text-align:center;
		}

		.upload-box{
			width:280px;
			height:170px;
		    border:1px dashed #666;
		    display:flex;
		    flex-direction:column;
		    justify-content:center;
		    align-items:center;
		    background:#fff;
		    cursor:pointer;
		}

		

		.upload-icon{
		    font-size:42px;
		    color:#777;
		    margin-bottom:8px;
		}

		.upload-text{
		    font-size:14px;
		    font-weight:600;
		    color:#111;
		}

		.upload-browse{
		    color:#0d6efd;
		    font-weight:600;
		    margin-top:4px;
		}

		.upload-box input{
		    display:none;
		}
    </style>
</head>
<body>

<div class="profile-layout">
    <!-- LEFT SIDEBAR -->
    

    <!-- MAIN CONTENT -->
    <div class="profile-main">
		<div class="top-nav">

		    <div class="top-nav-title">
		        <i class="fas fa-user-circle text-primary"></i>
		        My Profile
		    </div>

		</div>

		<div class="profile-tabs">

		    <button class="tab-btn active"
		            onclick="showProfileTab('v-pills-personal',this)">
		        General
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-edu',this)">
		        Classification
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-work',this)">
		        Statutory
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-project',this)">
		        Address
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-reporting',this)">
		        HR Category
		    </button>

		    <button class="tab-btn"
		            onclick="showProfileTab('v-pills-emergency',this)">
		        Documents
		    </button>

		</div>
		
       

        <div class="content-area">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show fw-bold shadow-sm mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="tab-pane-card">
                <form id="masterProfileForm" th:action="@{/employee/profile/save-detailed}" method="POST">
                    <!-- HIDDEN FIELD FOR REDIRECT -->
                    <input type="hidden" name="returnUrl" value="/employee/profile">
                    
                    <div class="tab-content" id="v-pills-tabContent">
                        
						<!-- GENERAL TAB -->
						<div id="v-pills-personal">

						    <div class="general-grid">

						        <div class="field-group">
						            <label>Employee ID *</label>
						            <input type="text"
						                   name="employeeId"
						                   th:value="${user.username}">
						        </div>

						        <div class="field-group">
						            <label>Spouse Name</label>
						            <input type="text"
						                   name="spouseName">
						        </div>

						        <div class="field-group">
						            <label>Full Name *</label>
						            <input type="text"
						                   name="fullName"
						                   th:value="${user.fullName}">
						        </div>

						        <div class="field-group">
						            <label>Date of Joining</label>
						            <input type="date"
						                   name="joiningDate"
						                   th:value="${user.employeeProfile?.joiningDate}">
						        </div>

						        <div class="field-group">
						            <label>Gender *</label>
						            <select name="gender">
						                <option value="">Select Gender</option>
						                <option value="Male">Male</option>
						                <option value="Female">Female</option>
						                <option value="Other">Other</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Date of Salary</label>
						            <input type="date"
						                   name="salaryDate">
						        </div>

						        <div class="field-group">
						            <label>Father's Name</label>
						            <input type="text"
						                   name="fatherName">
						        </div>

						        <div class="field-group">
						            <label>Probation Period (in days)</label>
						            <input type="number"
						                   name="probationPeriod">
						        </div>

						        <div class="field-group">
						            <label>Mother's Name</label>
						            <input type="text"
						                   name="motherName">
						        </div>

						        <div class="field-group notes-group">
						            <label>Notes</label>
						            <textarea name="notes"></textarea>
						        </div>

						        <div class="field-group">
						            <label>Marital Status *</label>
						            <select name="maritalStatus">
						                <option value="">Select Marital Status</option>
						                <option value="Single">Single</option>
						                <option value="Married">Married</option>
						                <option value="Divorced">Divorced</option>
						                <option value="Widowed">Widowed</option>
						            </select>
						        </div>

						    </div>

						</div>

						<!-- CLASSIFICATION TAB -->
						<div id="v-pills-edu" style="display:none;">

						    <div class="classification-grid">

						        <div class="field-group">
						            <label>Branch</label>
						            <input type="text" name="branch">
						        </div>

						        <div class="field-group">
						            <label>Designation</label>
						            <select name="designation">
						                <option value="">Select Designation</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Salary Structure</label>
						            <select name="salaryStructure">
						                <option value="">Select Salary Structure</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Bank</label>
						            <input type="text" name="bank">
						        </div>

						        <div class="field-group">
						            <label>Leave Policy</label>
						            <select name="leavePolicy">
						                <option value="">Select Leave Policy</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>A/C No.</label>
						            <input type="text" name="accountNumber">
						        </div>

						        <div class="field-group">
						            <label>Attendance Structure</label>
						            <select name="attendanceStructure">
						                <option value="">Select Attendance Structure</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>IFSC Code</label>
						            <input type="text" name="ifscCode">
						        </div>

						        <div class="field-group">
						            <label>Timesheet Policy</label>
						            <select name="timesheetPolicy">
						                <option value="">Select Timesheet Policy</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Department</label>
						            <select name="department">
						                <option value="">Select Department</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>T & A Policy</label>
						            <select name="taPolicy">
						                <option value="">Select T & A Policy</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Category</label>
						            <select name="category">
						                <option value="">Select Category</option>
						            </select>
						        </div>

						    </div>

						</div>
						<!-- STATUTORY TAB -->
						<div id="v-pills-work" style="display:none;">

						    <div class="statutory-grid">

						        <div class="field-group">
						            <label>Aadhar Card No.</label>
						            <input type="text"
						                   name="aadharNumber"
						                   placeholder="XXXX XXXX XXXX">
						        </div>

						        <div class="field-group">
						            <label>PF No.</label>
						            <input type="text"
						                   name="pfNumber">
						        </div>

						        <div class="field-group">
						            <label>PAN Card No.</label>
						            <input type="text"
						                   name="panNumber">
						        </div>

						        <div class="field-group">
						            <label>Passport No.</label>
						            <input type="text"
						                   name="passportNumber">
						        </div>

						        <div class="field-group">
						            <label>ESI No.</label>
						            <input type="text"
						                   name="esiNumber">
						        </div>

						        <div class="field-group">
						            <label>UAN</label>
						            <input type="text"
						                   name="uanNumber">
						        </div>

						    </div>

						</div>

						<!-- ADDRESS TAB -->
						<div id="v-pills-project" style="display:none;">

						    <div class="address-grid">

						        <!-- Present Address -->
						        <div class="address-column">

						            <div class="address-section-title">
						                Present Address
						            </div>

						            <div class="field-group">
						                <label>Residential Name</label>
						                <input type="text" name="presentResidentialName">
						            </div>

						            <div class="field-group">
						                <label>Street</label>
						                <input type="text" name="presentStreet">
						            </div>

						            <div class="field-group">
						                <label>City</label>
						                <input type="text" name="presentCity">
						            </div>

						            <div class="field-group">
						                <label>State</label>
						                <input type="text" name="presentState">
						            </div>

						            <div class="field-group">
						                <label>Pincode</label>
						                <input type="text" name="presentPincode">
						            </div>

						        </div>

						        <!-- Permanent Address -->
						        <div class="address-column">

						            <div class="address-section-title">
						                Permanent Address
						            </div>

						            <div class="field-group">
						                <label>Residential Name</label>
						                <input type="text" name="permanentResidentialName">
						            </div>

						            <div class="field-group">
						                <label>Street</label>
						                <input type="text" name="permanentStreet">
						            </div>

						            <div class="field-group">
						                <label>City</label>
						                <input type="text" name="permanentCity">
						            </div>

						            <div class="field-group">
						                <label>State</label>
						                <input type="text" name="permanentState">
						            </div>

						            <div class="field-group">
						                <label>Pincode</label>
						                <input type="text" name="permanentPincode">
						            </div>

						        </div>

						        <!-- Contact Info -->
						        <div class="address-column">

						            <div class="address-section-title">
						                Contact Info
						            </div>

						            <div class="field-group">
						                <label>Mobile No.</label>
						                <input type="text" name="mobileNo">
						            </div>

						            <div class="field-group">
						                <label>Alternate Mobile No.</label>
						                <input type="text" name="alternateMobileNo">
						            </div>

						            <div class="field-group">
						                <label>Official Email ID</label>
						                <input type="email" name="officialEmail">
						            </div>

						            <div class="field-group">
						                <label>Alternate Email ID</label>
						                <input type="email" name="alternateEmail">
						            </div>

						            <div class="field-group">
						                <label>Emergency No.</label>
						                <input type="text" name="emergencyNo">
						            </div>

						        </div>

						    </div>

						</div>
						<!-- HR CATEGORY TAB -->
						<div id="v-pills-reporting" style="display:none;">

						    <div class="hr-category-grid">

						        <div class="field-group">
						            <label>Blood Group</label>
						            <select name="bloodGroup">
						                <option value="">Select Blood Group</option>
						                <option>A+</option>
						                <option>A-</option>
						                <option>B+</option>
						                <option>B-</option>
						                <option>AB+</option>
						                <option>AB-</option>
						                <option>O+</option>
						                <option>O-</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Caste Category</label>
						            <select name="casteCategory">
						                <option value="">Select Category</option>
						                <option>General</option>
						                <option>OBC</option>
						                <option>SC</option>
						                <option>ST</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Qualification</label>
						            <select name="qualification">
						                <option value="">Select Qualification</option>
						                <option>10th</option>
						                <option>12th</option>
						                <option>Diploma</option>
						                <option>B.Tech</option>
						                <option>M.Tech</option>
						                <option>MBA</option>
						                <option>BCA</option>
						                <option>MCA</option>
						            </select>
						        </div>

						        <div class="field-group">
						            <label>Close Friend's Name</label>
						            <input type="text" name="closeFriendName">
						        </div>

						        <div class="field-group">
						            <label>Driving License No.</label>
						            <input type="text" name="drivingLicenseNo">
						        </div>

						        <div class="field-group">
						            <label>Nationality</label>
						            <input type="text" name="nationality">
						        </div>

						    </div>

						</div>
                        
						<!-- DOCUMENTS TAB -->
						<div id="v-pills-emergency" style="display:none;">

						    <div class="documents-grid">

						        <!-- Present Address Image -->
						        <div class="document-card">

						            <div class="document-title">
						                Present Address Image
						            </div>

						            <label class="upload-box">

						                <div class="upload-icon">
						                    <i class="fas fa-cloud-upload-alt"></i>
						                </div>

						                <div class="upload-text">
						                    Upload files here
						                </div>

						                <div>or</div>

						                <div class="upload-browse">
						                    Browse
						                </div>

						                <input type="file"
						                       name="presentAddressImage">

						            </label>

						        </div>

						        <!-- Aadhar Card Proof -->
						        <div class="document-card">

						            <div class="document-title">
						                Aadhar Card Proof
						            </div>

						            <label class="upload-box">

						                <div class="upload-icon">
						                    <i class="fas fa-cloud-upload-alt"></i>
						                </div>

						                <div class="upload-text">
						                    Upload files here
						                </div>

						                <div>or</div>

						                <div class="upload-browse">
						                    Browse
						                </div>

						                <input type="file"
						                       name="aadharProof">

						            </label>

						        </div>

						        <!-- PAN Card Proof -->
						        <div class="document-card center">

						            <div class="document-title">
						                PAN Card Proof
						            </div>

						            <label class="upload-box">

						                <div class="upload-icon">
						                    <i class="fas fa-cloud-upload-alt"></i>
						                </div>

						                <div class="upload-text">
						                    Upload files here
						                </div>

						                <div>or</div>

						                <div class="upload-browse">
						                    Browse
						                </div>

						                <input type="file"
						                       name="panProof">

						            </label>

						        </div>

						    </div>

						</div>
						
					</div>

                    <div class="action-footer">
                        <button type="button" class="btn btn-action btn-primary" id="editToggleBtn" onclick="toggleEditMode()">Complete Profile</button>
                        <a th:href="@{/default-redirect}" class="btn btn-action btn-outline">Back to Home</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // Initialization
    window.onload = function() {
        // Format empty info boxes
        document.querySelectorAll('.info-value-text').forEach(span => {
            if (!span.innerText || span.innerText.trim() === "") {
                span.innerText = "-";
                span.classList.add('empty-field');
            }
        });
        calculateCompletion();
    };

    function calculateCompletion() {
        const trackedFields = document.querySelectorAll('.tracked-field');
        if (trackedFields.length === 0) return;

        let filled = 0;
        trackedFields.forEach(f => {
            if(f.value && f.value.trim() !== "") filled++;
        });

        let percent = Math.round((filled / trackedFields.length) * 100);
        document.getElementById('completionBar').style.width = percent + '%';
        document.getElementById('percentLabel').innerText = percent + '%';
    }

    function toggleEditMode() {
        const body = document.body;
        const btn = document.getElementById('editToggleBtn');
        const form = document.getElementById('masterProfileForm');

        if (!body.classList.contains('editing')) {
            // ENTER EDIT MODE
            body.classList.add('editing');
            btn.innerHTML = '<i class="fas fa-save me-2"></i> Save Profile';
            btn.classList.replace('btn-primary', 'btn-success');
            btn.style.backgroundColor = '#16a34a';
            btn.style.color = '#fff';
            
            // Clean up placeholders
            document.querySelectorAll('.info-value-text.empty-field').forEach(span => {
                span.innerText = "";
            });
        } else {
            // SAVE LOGIC - Check validation across all tabs
            if (form.checkValidity()) {
                form.submit();
            } else {
                // Find first invalid element
                const invalidElement = form.querySelector(':invalid');
                if (invalidElement) {
                    // Find which tabpane it belongs to
                    const tabPane = invalidElement.closest('.tab-pane');
                    if (tabPane) {
                        // Activate that tab using Bootstrap Tab API
                        const tabId = tabPane.getAttribute('id');
                        const tabTrigger = document.querySelector(`[data-bs-target="#${tabId}"]`);
                        if(tabTrigger) {
                            const tab = new bootstrap.Tab(tabTrigger);
                            tab.show();
                        }
                    }
                    // Trigger browser's native validation UI
                    form.reportValidity();
                }
            }
        }
    }
	function showProfileTab(tabId, btn) {

	    const tabs = [
	        'v-pills-personal',
	        'v-pills-edu',
	        'v-pills-work',
	        'v-pills-project',
	        'v-pills-reporting',
	        'v-pills-emergency'
	    ];

	    tabs.forEach(id => {
	        document.getElementById(id).style.display = 'none';
	    });

	    document.getElementById(tabId).style.display = 'block';

	    document.querySelectorAll('.tab-btn').forEach(t => {
	        t.classList.remove('active');
	    });

	    btn.classList.add('active');
	}

</script>
